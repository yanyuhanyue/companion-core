[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "companion-core"
version = "0.5.0"
description = "Private conversational companion for AstrBot, with durable memory and DSH tasks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "tzdata>=2025.1",
    "alembic>=1.15,<2",
    "cryptography>=44,<48",
    "fastembed==0.9.0",
    "pillow>=12,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["companion"]

[tool.hatch.build]
exclude = [
    ".local/**", ".venv/**", "data/**", "privacy/**", "backups/**", "dist/**",
    ".env", "config.toml", "**/__pycache__/**", "**/*.py[cod]", "*.sqlite*", "*.log",
    ".pytest_cache/**", ".ruff_cache/**", ".codex-remote-attachments/**",
    ".playwright-cli/**", "output/playwright/**",
]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "companion/migrations"
"db/reference-v0.3.sql" = "companion/reference-v0.3.sql"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
