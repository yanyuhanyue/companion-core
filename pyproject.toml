[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "companion-core"
version = "0.5.0"
description = "Private conversational companion for AstrBot, with durable memory and DSH tasks"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "httpcore>=1,<2",
    "pydantic>=2.10,<3",
    "pydantic-ai-slim==2.60.0",
    "tzdata>=2025.1",
    "alembic>=1.15,<2",
    "cryptography>=44,<48",
    "fastembed==0.9.0",
    "tokenizers==0.23.3",
    "pillow>=12,<13",
    "av>=16,<17",
    "watchfiles==1.3.0",
]

[project.optional-dependencies]
onebot = [
    "websockets==15.0.1",
    "silk-python==0.2.8",
]
voice-node = [
    "faster-whisper==1.2.1",
]

[dependency-groups]
dev = [
    { include-group = "file-parser" },
    "pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5", "pyyaml>=6,<7",
    "pytest-xdist==3.8.0", "pytest-testmon==2.2.0", "filelock>=4,<5",
    "hypothesis==6.170.9",
    "trafilatura==2.3.1",
    "silk-python==0.2.8",
]
reader = [
    "playwright==1.64.0", "httpx==0.28.1", "httpcore==1.0.9", "trafilatura==2.3.1",
    "pillow>=12,<13", "av>=16,<17",
]
file-parser = [
    "python-docx==1.2.0", "pypdf==6.21.2", "lxml==6.1.3",
]

[tool.hatch.build.targets.wheel]
packages = [
    "companion", "source_reader", "companion_onebot_bridge", "companion_meme_protocol",
    "companion_voice_node", "companion_delivery_protocol", "companion_meme_sources",
]

[tool.hatch.build]
exclude = [
    ".local/**", ".venv/**", "data/**", "privacy/**", "backups/**", "dist/**",
    ".env", "config.toml", "**/__pycache__/**", "**/*.py[cod]", "*.sqlite*", "*.log",
    ".pytest_cache/**", ".ruff_cache/**", ".codex-remote-attachments/**",
    ".playwright-cli/**", "output/playwright/**",
    "**/*.owner-images/**",
]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "companion/migrations"
"db/reference-v0.3.sql" = "companion/reference-v0.3.sql"

[tool.ruff]
line-length = 100
extend-exclude = ["companion/token_artifacts/deepseek_v41/encoding.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
