openapi: 3.1.0
info:
  title: Companion Universal Gateway
  version: 1.0.0-g0
  description: >
    G0 interface contract only. No routes are registered by this slice.
    G1 targets authenticated, non-streaming text Passthrough requests.
    Alias selection does not grant a mode, identity or memory access.
x-implementation-stage: G0-contract-only
servers:
  - url: http://127.0.0.1:8780
security:
  - GatewayClientKey: []
paths:
  /v1/models:
    get:
      operationId: gatewayListModels
      description: >
        G1 returns configured aliases allowed for the authenticated client
        and its effective implemented mode. Upstream identifiers and secrets
        are never returned. Listing a model does not admit a billable request.
      responses:
        '200':
          description: Authorized model aliases
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                additionalProperties: false
                properties:
                  object: {const: list}
                  data:
                    type: array
                    maxItems: 64
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, object, created, owned_by]
                      properties:
                        id: {type: string, maxLength: 128}
                        object: {const: model}
                        created: {type: integer, minimum: 0}
                        owned_by: {const: companion-core}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/chat/completions:
    post:
      operationId: gatewayCreateChatCompletion
      description: >
        G1 non-streaming text subset. The client Key resolves the identity
        and grant; model resolves only a configured upstream route.
        System/developer text has no authority over mode or memory.
        Additional current grant, source, budget and final dispatch checks
        are mandatory; a G0 RouteIntent is never a ModelAdmission.
      parameters:
        - name: X-Companion-Mode
          in: header
          required: false
          description: Optional selector within the trusted grant; defaults to its default_mode.
          schema: {enum: [passthrough, companion, rp]}
        - name: X-Companion-Conversation-Id
          in: header
          required: false
          description: >
            Client-local conversation identity. Required in Companion/RP;
            lookup must include authenticated client, mode and world.
            Passthrough does not load a Core transcript.
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        - name: X-Companion-World-Id
          in: header
          required: false
          description: Required and allowlisted in RP; rejected in other modes.
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            G1 binds a supplied key to the authenticated client and exact
            frozen request. Missing keys identify new intents. Neither a
            repeated request nor a lost HTTP response permits replay of
            an original UNKNOWN attempt.
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './universal-gateway.v1.schema.json#/$defs/ChatRequest'
      responses:
        '200':
          description: G1 non-streaming completion after native settlement
          headers:
            X-Request-Id:
              description: Original Gateway request/receipt identity, not proof the user read it.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, object, created, model, choices, usage]
                properties:
                  id: {type: string}
                  object: {const: chat.completion}
                  created: {type: integer, minimum: 0}
                  model: {type: string, description: Original public alias}
                  choices:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [index, message, finish_reason]
                      properties:
                        index: {const: 0}
                        message:
                          type: object
                          additionalProperties: false
                          required: [role, content]
                          properties:
                            role: {const: assistant}
                            content: {type: string}
                        finish_reason: {enum: [stop, length, content_filter]}
                  usage:
                    type: object
                    additionalProperties: false
                    required: [prompt_tokens, completion_tokens, total_tokens]
                    properties:
                      prompt_tokens: {type: integer, minimum: 0}
                      completion_tokens: {type: integer, minimum: 0}
                      total_tokens: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    GatewayClientKey:
      type: http
      scheme: bearer
      description: Independent Gateway client Key; never a Bridge or owner-control credential.
  responses:
    Error:
      description: >
        Structured error. No secret, private context or raw upstream response
        is included. Unknown dispatched usage retains its original reservation.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [message, type, param, code]
                properties:
                  message: {type: string}
                  type: {type: string}
                  param: {type: [string, 'null']}
                  code: {type: [string, 'null']}
