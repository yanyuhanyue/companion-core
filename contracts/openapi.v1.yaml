openapi: 3.1.0
info:
  title: Companion Core Internal API
  version: 0.4.0
  description: >-
    Private Docker-network API; versioned contract for M0-M1.5.
    Protected by bearer token; NOT exposed to public Internet.
    Optional media/account capability routes and their activation requirements
    are documented in docs/qq-beta/media-autonomy.md. M0/M1 do not execute them.
servers:
  - url: http://companion-api:8765
security:
  - bridgeToken: []
paths:
  /internal/v1/health/live:
    get:
      operationId: liveness
      description: API process alive only; worker_health_proven is false.
      security: []
      responses:
        '200': {description: Service process alive}
  /internal/v1/health/ready:
    get:
      operationId: readiness
      responses:
        '200': {description: DB ready and migrations compatible}
        '503': {description: Not ready}
  /internal/v1/inbox/events:
    post:
      operationId: ingestEvent
      description: >-
        Auth+owner allowlist check precedes writes. Atomic transaction creates
        event and reply job. Repeated (source,source_event_id) returns same job.
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './event.v1.schema.json'
      responses:
        '202':
          description: Accepted or replay of previously accepted event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestReply'}
        '400': {description: Invalid contract}
        '401': {description: Missing/invalid authentication}
        '403': {description: Actor or scope not allowed}
        '409': {description: Same idempotency key with different payload}
  /internal/v1/deliveries/lease:
    post:
      operationId: leaseDeliveries
      description: >-
        Reserve pending deliveries for an authenticated Bridge. The default lane
        is owner_private. qq_account requires its explicitly enabled capability,
        current owner reference and account-action authorization hash;
        it does not extend M0/M1 permissions.
        Live owner operation requires the current authority reference, validated
        again against native custody when leasing. Omitting authority is only
        available when the runtime does not require owner authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id]
              properties:
                worker_id: {type: string, minLength: 1, maxLength: 128}
                limit: {type: integer, minimum: 1, maximum: 20, default: 5}
                delivery_lane: {enum: [owner_private, qq_account], default: owner_private}
                authority:
                  oneOf:
                    - $ref: '#/components/schemas/AuthorityRef'
                    - type: 'null'
                account_actions_authorization_sha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
              allOf:
                - if:
                    required: [delivery_lane]
                    properties:
                      delivery_lane: {const: qq_account}
                  then:
                    required: [authority, account_actions_authorization_sha256]
                    properties:
                      authority: {$ref: '#/components/schemas/AuthorityRef'}
                      account_actions_authorization_sha256: {type: string}
                  else:
                    properties:
                      account_actions_authorization_sha256: {type: 'null'}
      responses:
        '200':
          description: Leased deliveries within the requested approved lane
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Delivery'}
  /internal/v1/deliveries/{message_id}/begin-send:
    post:
      operationId: beginDeliverySend
      description: >-
        Atomically transition LEASED to SENDING before the first network send.
        Expired LEASED can be safely requeued; expired SENDING is uncertain.
      parameters:
        - in: path
          name: message_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_token]
              properties:
                lease_token: {type: string}
      responses:
        '200': {description: Ready for one send attempt}
        '409': {description: Stale lease / already started}
  /internal/v1/deliveries/{message_id}/result:
    post:
      operationId: commitDeliveryResult
      description: >-
        Sender reports SENT with provider message id, RETRYABLE_FAILURE, or
        DELIVERY_UNCERTAIN. A lease token prevents stale workers from ACKing.
        Native poke and account actions carry their actual protocol receipts;
        they never invent a QQ message id. Unknown outcomes are not retried blindly.
      parameters:
        - in: path
          name: message_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './delivery-result.v1.schema.json'
      responses:
        '200': {description: Result stored}
        '409': {description: Stale lease / invalid transition}
  /internal/v1/memories/search:
    post:
      operationId: searchMemories
      description: Subject and visibility access checks are mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, requester_actor_id]
              properties:
                query: {type: string, minLength: 1, maxLength: 1000}
                requester_actor_id: {type: string}
                subject_filter:
                  type: array
                  items: {enum: [user, self, relationship, project]}
                limit: {type: integer, minimum: 1, maximum: 10, default: 6}
      responses:
        '200':
          description: Results with evidence status and provenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/MemoryResult'}
  /internal/v1/memories/{memory_id}/decisions:
    post:
      operationId: decideMemory
      description: >-
        Owner-only confirm/correct/forget. Correct produces a superseding memory;
        forget purges active retrieval and derived summaries/trait evidence.
      parameters:
        - in: path
          name: memory_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor_id, decision]
              properties:
                actor_id: {const: owner}
                decision: {enum: [confirm, correct, forget]}
                corrected_content: {type: [string, 'null']}
      responses:
        '200': {description: Decision accepted; dependent projections queued for reconciliation}
        '403': {description: Requester is not owner}
  /internal/v1/ops/status:
    get:
      operationId: opsStatus
      description: >-
        Content-free counters and read-only operations snapshot. API instance is
        process evidence, not a worker heartbeat. No model invocation or state repair.
      parameters:
        - in: query
          name: summary_only
          schema: {type: boolean, default: false}
          description: Lightweight operations snapshot without the full live-window guard.
      responses:
        '200': {description: Queue depth, model budget, degraded modules}
  /internal/v1/diary:
    get:
      operationId: listDiary
      security: [{diaryAdmin: []}]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 31, default: 7}
      responses:
        '200': {description: Recent committed private diary metadata, never drafts}
        '400': {description: Invalid limit}
        '401': {description: Independent diary administrator credential required}
  /internal/v1/diary/status:
    get:
      operationId: diaryStatus
      security: [{diaryAdmin: []}]
      responses:
        '200': {description: Configured and runtime flags plus latest run state}
        '401': {description: Independent diary administrator credential required}
  /internal/v1/diary/runtime-mode:
    post:
      operationId: diaryRuntimeMode
      security: [{diaryAdmin: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: Runtime mode applied; disabling cancels uncommitted runs}
        '400': {description: Invalid contract}
        '401': {description: Independent diary administrator credential required}
        '409': {description: Configuration hard-disable cannot be overridden}
  /internal/v1/diary/{day}:
    get:
      operationId: readDiary
      security: [{diaryAdmin: []}]
      parameters: [{$ref: '#/components/parameters/DiaryDay'}]
      responses:
        '200':
          description: Committed diary after evidence expiry checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiaryEntry'}
        '400': {description: Invalid date}
        '401': {description: Independent diary administrator credential required}
        '404': {description: No committed diary for this day}
  /internal/v1/diary/{day}/forget:
    post:
      operationId: forgetDiary
      security: [{diaryAdmin: []}]
      parameters: [{$ref: '#/components/parameters/DiaryDay'}]
      responses:
        '200': {description: Idempotent deletion persisted to the independent erasure ledger}
        '400': {description: Invalid date}
        '401': {description: Independent diary administrator credential required}
        '503': {description: Erasure ledger invalid or unavailable; fail closed}
  /internal/v1/diary/{day}/correction:
    post:
      operationId: correctDiary
      security: [{diaryAdmin: []}]
      parameters: [{$ref: '#/components/parameters/DiaryDay'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 8000}
      responses:
        '200':
          description: Owner correction recorded, subject to configured body limit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiaryEntry'}
        '400': {description: Invalid date, length, or sensitive content}
        '401': {description: Independent diary administrator credential required}
        '404': {description: No committed diary for this day}
components:
  securitySchemes:
    bridgeToken:
      type: http
      scheme: bearer
    diaryAdmin:
      type: http
      scheme: bearer
      description: Distinct administrator secret; the Bridge credential is rejected.
  parameters:
    DiaryDay:
      in: path
      name: day
      required: true
      schema: {type: string, format: date}
  schemas:
    AuthorityRef:
      type: object
      additionalProperties: false
      required: [version, grant_id, revision, policy_sha256, restore_generation]
      properties:
        version: {type: integer, const: 2}
        grant_id: {type: string, pattern: '^grant_[a-f0-9]{32}$'}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        policy_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        restore_generation: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    DiaryEntry:
      type: object
      required: [entry_id, local_date, title, body_md, version, created_at, updated_at]
      properties:
        entry_id: {type: string}
        local_date: {type: string, format: date}
        title: {type: string}
        body_md: {type: string}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    IngestReply:
      type: object
      required: [event_id, job_id, duplicate, state]
      properties:
        event_id: {type: string}
        job_id: {type: string}
        duplicate: {type: boolean}
        state: {enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
    Delivery:
      type: object
      required: [message_id, conversation_platform_session_key, content, lease_token, lease_until, delivery_key]
      properties:
        message_id: {type: string}
        conversation_platform_session_key: {type: string}
        content: {type: object}
        lease_token: {type: string}
        lease_until: {type: string, format: date-time}
        delivery_key: {type: string}
        action_type:
          enum: [qq.private.reply, qq.private.proactive, qq.private.poke, qzone.publish,
                 qq.profile.nickname, qq.profile.signature, qq.profile.avatar]
        delivery_lane: {enum: [owner_private, qq_account]}
        authority: {$ref: '#/components/schemas/AuthorityRef'}
        origin_event_id: {type: string}
        content_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        reply_revision: {type: integer, minimum: 0}
    MemoryResult:
      type: object
      required: [memory_id, subject, content, status, confidence, evidence_ids]
      properties:
        memory_id: {type: string}
        subject: {enum: [user, self, relationship, project]}
        content: {type: string}
        status: {enum: [HYPOTHESIS, CONFIRMED]}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence_ids:
          type: array
          items: {type: string}
