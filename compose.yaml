name: companion
x-core: &core
  build: .
  image: companion-core:0.5.0
  env_file: .env
  environment:
    COMPANION_CONFIG: /app/config.toml
    COMPANION_DATABASE: /data/companion.sqlite3
    COMPANION_ERASURE_LEDGER: /privacy/erasures.jsonl
    COMPANION_EMBEDDING_CACHE_DIR: /data/embedding-cache
  volumes:
    - ./config.toml:/app/config.toml:ro
    - core-data:/data
    - erasure-ledger:/privacy
  networks: [companion]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Python is not PID 1: tini forwards SIGTERM to it and reaps children.
  init: true
  stop_grace_period: 60s
# Workers finish the unit in flight on SIGTERM, then exit 0. Their grace period must
# outlast one unit's model calls (bounded by lease_seconds, default 120, in
# companion/config.py); a SIGKILL mid-call leaves an UNKNOWN attempt that holds the
# execution slot until an operator closes it.
x-worker-grace: &worker-grace 150s
services:
  migrate:
    <<: *core
    command: [init]
    restart: "no"
  companion-api:
    <<: *core
    command: [serve, --host, 0.0.0.0]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/internal/v1/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  companion-worker:
    <<: *core
    command: [worker]
    stop_grace_period: *worker-grace
    depends_on:
      companion-api: {condition: service_healthy}
    restart: unless-stopped
  companion-life-worker:
    <<: *core
    profiles: [life]
    command: [life-worker]
    stop_grace_period: *worker-grace
    depends_on:
      companion-api: {condition: service_healthy}
    restart: unless-stopped
  companion-executive-worker:
    <<: *core
    profiles: [tools]
    command: [executive-worker]
    stop_grace_period: *worker-grace
    depends_on:
      companion-api: {condition: service_healthy}
    restart: unless-stopped
  companion-content-worker:
    <<: *core
    profiles: [content]
    command: [content-worker]
    stop_grace_period: *worker-grace
    depends_on:
      companion-api: {condition: service_healthy}
    restart: unless-stopped
networks:
  companion:
    name: companion-internal
volumes:
  core-data:
  erasure-ledger:
