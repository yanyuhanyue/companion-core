# Copy to config.toml; secrets and QQ IDs are environment variables.
mode = "live"
database = "data/companion.sqlite3"
erasure_ledger = "privacy/erasures.jsonl"
timezone = "Asia/Shanghai"
provider = "deepseek"
model_url = "https://api.deepseek.com"
model_name = "deepseek-flash"
max_output_tokens = 768
context_soft_tokens = 3200
max_recent_messages = 12
# Integer micro-USD per million tokens, upper-bound peak rates verified 2026-10-19.
# https://api-docs.deepseek.com/quick_start/pricing/
# Estimates, not provider invoices. Omit all rates for unknown pricing.
input_rate = 300000
cached_input_rate = 6000
output_rate = 1200000
monthly_limit_micro_usd = 20000000
autonomous_daily_micro_usd = 200000
memory_daily_micro_usd = 50000
# Enable after completing M0 checks in your environment.
memory_enabled = false
embedding_cache_dir = "data/embedding-cache"
semantic_min_score = 0.5
extraction_min_events = 5
extraction_idle_seconds = 900
proactive_enabled = true
proactive_interval_seconds = 10800
proactive_idle_seconds = 3600
proactive_daily_limit = 2
quiet_start = 23
quiet_end = 8
lease_seconds = 120
raw_event_retention_days = 365

# M1.5: enable only after diary and deployment acceptance. Uses `timezone` above.
diary_enabled = false
diary_generate_hour = 2
diary_min_source_events = 3
diary_max_source_events = 40
diary_max_output_tokens = 700
diary_max_body_chars = 2400
diary_catchup_days = 3
diary_max_attempts = 2
diary_daily_micro_usd = 50000
diary_auto_share = false
# Optional HTTP diary administration: set a distinct COMPANION_DIARY_ADMIN_TOKEN.
# The Bridge token cannot list, export, edit, or delete diaries over this API.

# v0.5: independent observation adapters; never use Bridge or owner control tokens here.
observation_enabled = false
affect_enabled = false
affect_decay_minutes = 180
affect_max_evidence = 12
consolidation_enabled = false
consolidation_local_hour = 3
consolidation_catchup_days = 3
reflection_enabled = false
reflection_daily_max_suggestions = 3
reflection_min_sources = 3
reflection_max_daily_calls = 1
reflection_max_output_tokens = 600
reflection_daily_micro_usd = 0
reflection_monthly_micro_usd = 0
goals_enabled = false
goals_max_active = 10
goal_max_attempts = 3
wake_enabled = false
wake_min_interval_minutes = 180
wake_max_daily_runs = 3
exploration_enabled = false
exploration_daily_candidate_limit = 40
exploration_daily_deep_reads = 5
exploration_daily_requests = 0
exploration_monthly_requests = 0
exploration_max_response_bytes = 524288
exploration_daily_bytes = 0
social_enabled = false
social_semantic_threshold = 0.9
expression_enabled = false
content_enabled = false
expression_cooldown_minutes = 30
expression_meme_categories = ["happy", "like", "surprised", "morning", "sleep"]
voice_enabled = false
camera_enabled = false
android_enabled = false
# Set COMPANION_CONTROL_TOKEN for owner-only v2 management.
# Set COMPANION_OBSERVATION_ADAPTERS to a JSON object of adapter IDs and
# {"token":"distinct-secret-at-least-24-characters","source":"bilibili"}.
# Independent source_reader: set reader_max_requests=4 on its bilibili adapter;
# default 1 preserves existing Bridge readers. See docs/design-v0.6/source-reader.md.
# Heybox source_reader uses reader_max_requests=1; see docs/design-v0.6/heybox-reader.md.

# See deploy/executive.example.toml for independently authenticated executor endpoints.
[executive]
enabled = false
allow_changes = false
daily_calls = 0
daily_micro_usd = 0
monthly_micro_usd = 0

# Explicit short owner sessions; configure HTTPS providers and bounded costs before enabling.
[media]
enabled = false
daily_micro_usd = 0
max_session_seconds = 180
max_session_bytes = 2000000
max_chunk_bytes = 64000

[content]
max_links_per_event = 2
max_images_per_event = 2
max_images_per_article = 32
article_image_micro_usd = 50000
use_chat_model_for_vision = false
max_image_bytes = 1000000
max_daily_image_bytes = 32000000
max_daily_images = 32
image_daily_micro_usd = 0
wait_seconds = 30

# Explicit opt-in: use_chat_model_for_vision=true reuses the chat URL/model/key.
# deepseek-flash supports image input; both cost limits must be positive before calls.
[content.vision]
max_request_micro_usd = 0

# Optional text bubbles for generated chat replies. Omitted by default (one reply).
# Bounded live windows also need a matching segmented-reply scope and send cap.
# See docs/qq-beta/segmented-replies.md.
# [segmented_reply]
# max_segments = 3
# min_chars = 12
# interval_ms = 1500
