# Copy to config.toml; secrets and QQ IDs are environment variables.
mode = "live"
database = "data/companion.sqlite3"
erasure_ledger = "privacy/erasures.jsonl"
timezone = "Asia/Shanghai"
provider = "deepseek"
model_url = "https://api.deepseek.com"
model_name = "deepseek-flash"
max_output_tokens = 768
context_soft_tokens = 3200
max_recent_messages = 12
# Integer micro-USD per million tokens, upper-bound peak rates verified 2026-10-19.
# https://api-docs.deepseek.com/quick_start/pricing/
# Estimates, not provider invoices. Omit all rates for unknown pricing.
input_rate = 300000
cached_input_rate = 6000
output_rate = 1200000
monthly_limit_micro_usd = 20000000
autonomous_daily_micro_usd = 200000
memory_daily_micro_usd = 50000
# Enable after completing M0 checks; run life-worker for background memory extraction.
memory_enabled = false
evaluation_enabled = false # Owner-consented, six-call no-delivery experiments on the same budget.
embedding_cache_dir = "data/embedding-cache"
semantic_min_score = 0.5
extraction_min_events = 5
extraction_idle_seconds = 900
proactive_enabled = true
proactive_interval_seconds = 10800
proactive_idle_seconds = 3600
proactive_daily_limit = 2
quiet_start = 23
quiet_end = 8
lease_seconds = 120
raw_event_retention_days = 365

# M1.5: enable only after diary and deployment acceptance. Uses `timezone` above.
diary_enabled = false
diary_generate_hour = 2
diary_min_source_events = 3
diary_max_source_events = 40
diary_max_output_tokens = 700
diary_max_body_chars = 2400
diary_catchup_days = 3
diary_max_attempts = 2
diary_daily_micro_usd = 50000
diary_auto_share = false
# Optional HTTP diary administration: set a distinct COMPANION_DIARY_ADMIN_TOKEN.
# The Bridge token cannot list, export, edit, or delete diaries over this API.

# v0.5: independent observation adapters; never use Bridge or owner control tokens here.
observation_enabled = false
affect_enabled = false
affect_decay_minutes = 180
affect_max_evidence = 12
consolidation_enabled = false
consolidation_local_hour = 3
consolidation_catchup_days = 3
reflection_enabled = false
reflection_daily_max_suggestions = 3
reflection_min_sources = 3
reflection_max_daily_calls = 1
reflection_max_output_tokens = 600
reflection_daily_micro_usd = 0
reflection_monthly_micro_usd = 0
goals_enabled = false
goals_max_active = 10
goal_max_attempts = 3
wake_enabled = false
wake_min_interval_minutes = 180
wake_max_daily_runs = 3
exploration_enabled = false
exploration_daily_candidate_limit = 40
exploration_daily_deep_reads = 5
exploration_daily_requests = 0
exploration_monthly_requests = 0
exploration_max_response_bytes = 524288
exploration_daily_bytes = 0
social_enabled = false
social_semantic_threshold = 0.9
expression_enabled = false
expression_learning_enabled = false
content_enabled = false
web_reading_enabled = false
expression_cooldown_minutes = 30
expression_meme_categories = ["happy", "like", "surprised", "morning", "sleep"]
meme_discovery_enabled = false
meme_semantics_enabled = false
meme_caption_daily_micro_usd = 0
meme_caption_max_output_tokens = 2000
# Caption calls also require paid_model.meme_input with max_images_per_request <= 5,
# and an approved private window. See docs/qq-beta/memes-semantic.md.
voice_enabled = false
camera_enabled = false
android_enabled = false
# Set COMPANION_CONTROL_TOKEN for owner-only v2 management.
# Set COMPANION_OBSERVATION_ADAPTERS to a JSON object of adapter IDs and
# {"token":"distinct-secret-at-least-24-characters","source":"bilibili"}.
# Independent source_reader: set reader_max_requests=4 on its bilibili adapter;
# default 1 preserves existing Bridge readers. See docs/design-v0.6/source-reader.md.
# Heybox source_reader uses reader_max_requests=1; see docs/design-v0.6/heybox-reader.md.
# Web reading additionally requires an adapter with source="web", explicit allowed_hosts,
# and source_reader --protocol reading-v1. Hosts never come from a model or page text.
# See docs/qq-beta/next-reading.md for the v3 evidence and cancellation contract.

# See deploy/executive.example.toml for independently authenticated executor endpoints.
[executive]
enabled = false
allow_changes = false
daily_calls = 0
daily_micro_usd = 0
monthly_micro_usd = 0

# Explicit short owner sessions; configure HTTPS providers and bounded costs before enabling.
[media]
enabled = false
daily_micro_usd = 0
max_session_seconds = 180
max_session_bytes = 2000000
max_chunk_bytes = 64000

[content]
max_links_per_event = 2
max_images_per_event = 2
# 可设正整数或 "unlimited"；需同时配置 paid_model.image_input.max_images_per_request。
# 图片+已批准记忆使用 per_request_calls=3；具体窗口配置见 docs/qq-input-understanding.md。
max_images_per_article = 32
article_image_micro_usd = 50000
use_chat_model_for_vision = false
max_image_bytes = 1000000
max_daily_image_bytes = 32000000
max_daily_images = 32
image_daily_micro_usd = 0
wait_seconds = 30

# Explicit opt-in: use_chat_model_for_vision=true reuses the chat URL/model/key.
# deepseek-flash supports image input; both cost limits must be positive before calls.
[content.vision]
max_request_micro_usd = 0

# Optional text bubbles for generated chat replies. Omitted by default (one reply).
# Bounded live windows also need a matching segmented-reply scope and send cap.
# See docs/qq-beta/segmented-replies.md.
# [segmented_reply]
# max_segments = 3
# min_chars = 12
# interval_ms = 1500

# Optional owner-private media and account actions. All top-level capabilities remain off.
# Activation prerequisites, signed scopes and deployment: docs/qq-beta/media-autonomy.md.
# These planning ceilings attach to native model/tool charges; they do not enable a provider.
[cloud_budget]
daily_micro_cny = 20000000
video_per_item_micro_cny = 1000000
asr_per_item_micro_cny = 500000
usd_to_cny_micro = 8000000
fx_source = "operator_planning_estimate"
fx_validity_seconds = 2592000

[private_files]
enabled = false
parser_image = ""
parser_socket = ""
adapter_id = "content_file"
max_files_per_event = 2
max_daily_files = 32
max_daily_bytes = 67108864
wait_seconds = 75
upload_window_seconds = 300
upload_lease_seconds = 20
worker_lease_seconds = 50
spool_retention_seconds = 300
# Production uses the pinned host parser and /run/companion-parser/parser.sock.
# No Core container receives the Docker socket; only content-worker receives the parser socket.
[private_files.limits]
max_file_bytes = 8388608
max_expanded_bytes = 33554432
max_zip_entries = 512
max_compression_ratio = 200
max_pages = 200
max_records = 2000
max_text_chars = 12000
max_table_depth = 8
max_pdf_stream_bytes = 8388608
cpu_seconds = 15
wall_seconds = 30
memory_bytes = 805306368
scratch_bytes = 134217728
max_processes = 96

[bili_video]
enabled = false
deadline_seconds = 180
max_concurrent = 1
max_context_chars = 3000
# Reader --media-limits must contain this COMPLETE object, exactly matching Core.
[bili_video.media]
max_preview_frames = 4
max_clips = 3
max_clip_seconds = 20.0
max_total_clip_seconds = 30.0
max_input_bytes = 33554432
max_asset_bytes = 4000000
max_total_output_bytes = 8000000
max_width = 512
max_height = 512
max_source_pixels = 8294400
max_source_seconds = 36000.0
max_decoded_frames = 3000
max_output_frames = 1501
output_fps = 25
timestamp_tolerance_seconds = 0.04
max_frame_gap_seconds = 1.0
timeout_seconds = 30.0
terminate_grace_seconds = 1.0
max_process_output_bytes = 262144
max_memory_bytes = 536870912
[bili_video.sampling]
initial_frames = 4
max_segments = 3
max_segment_seconds = 20.0
max_total_segment_seconds = 30.0

[poke_policy]
enabled = false
mode = "auto"
allow_native = false
coalesce_seconds = 2
cooldown_seconds = 30
daily_limit = 20
max_coalesced = 20
max_text_chars = 160
max_pending_seconds = 300

# Local outbound voice nodes; this is separate from the legacy voice_enabled/media switches.
# Keep signing_private_key and per-node credentials in private COMPANION_VOICE JSON.
# An enabled node also requires its measured manifest_sha256 and matching local provider files.
[voice]
enabled = false
nodes = {}
job_ttl_seconds = 90
lease_ttl_seconds = 30
result_ttl_seconds = 90
max_pending_jobs = 32
max_private_blob_bytes = 32000000
# Subpolicy defaults apply only after the top-level voice capability is enabled and scoped.
[voice.reply]
enabled = true
mode = "voice_input"
max_chars = 400
wait_seconds = 15
proactive = false
[voice.asr]
enabled = true
wait_seconds = 20
max_records = 2
max_context_chars = 4000

[social_autonomy]
enabled = false
scope = "none"
# Enabling requires authorization_sha256; avatar additionally requires asset_policy_sha256.
# Both hashes must refer to actual approved scope/review evidence in the signed plan.
policy_version = 1
qzone_enabled = false
nickname_enabled = false
signature_enabled = false
avatar_enabled = false
qzone_daily_limit = 1
profile_daily_limit = 1
qzone_cooldown_seconds = 3600
profile_cooldown_seconds = 604800
model_daily_calls = 4
model_daily_micro_usd = 100000
decision_interval_seconds = 3600
max_publish_chars = 500
max_nickname_chars = 24
max_signature_chars = 120
max_source_refs = 3
max_source_chars = 3000
max_input_bytes = 16000
max_output_tokens = 1024
timeout_seconds = 45
plan_ttl_seconds = 3600
profile_baseline_seconds = 300
max_pending_plans = 4
max_asset_bytes = 2097152
max_asset_dimension = 2048
