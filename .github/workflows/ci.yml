name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: data/embedding-cache
          key: bge-small-zh-${{ runner.os }}-46fbe35fd4374a00fee7de77dfddaeb6dd6a2c59
      - run: uv run ruff check companion source_reader migrations astrbot_plugin_companion_bridge tests scripts
      - run: uv run pytest -q --basetemp=.local/test-temp
      - run: uv run python scripts/replay.py
      - run: uv run python scripts/smoke.py
      - run: uv build
      - run: uv run python scripts/verify_package.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t companion-core:test .
      - run: docker build -f deploy/executor.Dockerfile -t companion-executor:test .
      - run: docker build -f deploy/source-reader.Dockerfile -t companion-source-reader:test .
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 768m --pids-limit 96
          --tmpfs /scratch:rw,nosuid,nodev,size=128m,uid=10003,gid=10003,mode=0700
          companion-source-reader:test --help
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --cpus 1 --memory 768m --pids-limit 96
          --tmpfs /scratch:rw,nosuid,nodev,size=128m,uid=10003,gid=10003,mode=0700
          -v "${{ github.workspace }}/scripts/smoke_plugin_readonly.py:/app/verify.py:ro"
          --entrypoint python companion-source-reader:test /app/verify.py
      - run: >-
          docker run --rm --network none --entrypoint python companion-executor:test
          -c "import companion.executor_gateway, companion.executor_budget_proxy, companion.dsh_job"
      - run: >-
          docker run --rm --network none --user 10002:10002 --read-only
          --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 64
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          --tmpfs /scratch:rw,nosuid,nodev,exec,size=768m,uid=10002,gid=10002,mode=0700
          -v "${{ github.workspace }}/scripts/smoke_executor.py:/verify.py:ro"
          --entrypoint python companion-executor:test /verify.py
      - run: >-
          docker run --rm
          -e COMPANION_OWNER_QQ_ID=10001 -e COMPANION_BOT_QQ_ID=10002
          -e COMPANION_BRIDGE_TOKEN=container-test-token-32-characters
          -e COMPANION_MODE=demo
          -e COMPANION_MEMORY_ENABLED=true
          -e COMPANION_DIARY_ENABLED=true
          -e COMPANION_DATABASE=/data/test.sqlite3
          -e COMPANION_ERASURE_LEDGER=/privacy/test.jsonl
          -e COMPANION_EMBEDDING_CACHE_DIR=/data/embedding-cache
          companion-core:test init
  browser-reader:
    runs-on: windows-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright-browsers
      COMPANION_TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen --group reader
      - run: uv run --group reader python -m playwright install chromium --only-shell
      - shell: pwsh
        run: ./scripts/check.ps1 -TestFiles tests/test_source_browser.py
  plugin-native:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 674537331/astrbot_plugin_xiaoheihe_adapter
          ref: 90d3c9d4d051f912d80ba02b38d5f8f0a5a95aac
          path: .local/p3/upstream/heybox
      - uses: actions/checkout@v4
        with:
          repository: c1overzz/dsh-bili-scroll
          ref: 9a3e0e67d82feedf755c763807c806c4d125a245
          path: .local/p3/upstream/bili
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv venv .local/p3/native-venv
      - run: >-
          uv pip sync --python .local/p3/native-venv/bin/python --require-hashes
          docs/design-v0.6/upstream-native-p3.lock
      - run: >-
          .local/p3/native-venv/bin/python scripts/verify_plugin_native.py
          --upstream-root .local/p3/upstream
      - working-directory: .local/p3/upstream/heybox
        run: >-
          ${{ github.workspace }}/.local/p3/native-venv/bin/python -m pytest -q
          tests/test_api_client.py tests/test_request_signing.py tests/test_parsers.py
          tests/test_feed_service.py tests/test_topic_service.py tests/test_permissions.py
          --basetemp=${{ github.workspace }}/.local/test-temp/native
          -o cache_dir=${{ github.workspace }}/.local/p3/pytest-cache
