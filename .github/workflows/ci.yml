name: checks
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch) }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      reuse: ${{ steps.plan.outputs.reuse }}
      windows: ${{ steps.plan.outputs.windows }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_policy.py plan
  quality:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ needs.preflight.outputs.profile != 'reuse' }}
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: ${{ needs.preflight.outputs.profile != 'reuse' }}
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-3.12
      - run: uv sync --frozen --extra onebot
        if: ${{ needs.preflight.outputs.profile != 'reuse' }}
      - name: Verify reused full CI still matches this checkout
        if: ${{ needs.preflight.outputs.profile == 'reuse' }}
        env:
          CI_REUSE: ${{ needs.preflight.outputs.reuse }}
        run: python scripts/ci_reuse.py validate
      - if: ${{ needs.preflight.outputs.profile == 'full' || needs.preflight.outputs.profile == 'selected' }}
        run: uv run --extra onebot ruff check companion companion_onebot_bridge companion_meme_protocol companion_voice_node companion_delivery_protocol source_reader migrations astrbot_plugin_companion_bridge tests scripts
      - name: Type-check the owner console
        if: ${{ needs.preflight.outputs.profile == 'full' || needs.preflight.outputs.profile == 'selected' }}
        # Explicit package selection: https://docs.npmjs.com/cli/v11/commands/npm-exec/
        env:
          npm_config_cache: ${{ github.workspace }}/.local/npm-cache
        run: npm exec --yes --package=typescript@5.9.3 -- tsc -p tsconfig.console.json
      - name: Validate documentation privacy, references and evidence
        if: ${{ needs.preflight.outputs.profile == 'docs' || (needs.preflight.outputs.profile == 'selected' && !fromJSON(needs.preflight.outputs.windows).product) }}
        run: uv run --extra onebot python scripts/ci_policy.py docs
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    needs: preflight
    if: ${{ needs.preflight.outputs.profile == 'full' || needs.preflight.outputs.profile == 'selected' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-3.12
      - run: uv sync --frozen --extra onebot
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ fromJSON(needs.preflight.outputs.windows).product }}
        with:
          path: data/embedding-cache
          key: bge-small-zh-${{ runner.os }}-46fbe35fd4374a00fee7de77dfddaeb6dd6a2c59
      - name: Run a complete, disjoint suite shard
        if: ${{ fromJSON(needs.preflight.outputs.windows).product }}
        run: >-
          uv run --extra onebot python -B -m scripts.test_feedback --workers 2 --
          -p scripts.ci_shards
          --ci-shard=${{ matrix.shard }} --durations=15
          --basetemp=.local/test-temp --junitxml=.local/test-results/pytest.xml
      - name: Validate console assets and owner API contracts
        if: ${{ !fromJSON(needs.preflight.outputs.windows).product }}
        run: >-
          uv run --extra onebot python -m pytest -q tests/test_console_static.py
          tests/test_owner_console.py tests/test_console_cognition.py
          --basetemp=.local/test-temp --junitxml=.local/test-results/pytest.xml
      - if: ${{ matrix.shard == matrix.verify_shard && fromJSON(needs.preflight.outputs.windows).product }}
        run: uv run python scripts/replay.py
      - if: ${{ matrix.shard == matrix.verify_shard && fromJSON(needs.preflight.outputs.windows).product }}
        run: uv run python scripts/smoke.py
      - if: ${{ matrix.shard == matrix.verify_shard }}
        run: uv build
      - if: ${{ matrix.shard == matrix.verify_shard }}
        run: uv run python scripts/verify_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.shard }}
          path: .local/test-results/pytest.xml
          if-no-files-found: error
          retention-days: 7
  container:
    needs: preflight
    if: ${{ (needs.preflight.outputs.profile == 'full' || needs.preflight.outputs.profile == 'selected') && fromJSON(needs.preflight.outputs.windows).product }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      images-artifact-id: ${{ steps.images.outputs.artifact-id }}
      images-artifact-digest: ${{ steps.images.outputs.artifact-digest }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python scripts/verify_onebot_compose.py
      - name: Restore public-source BuildKit cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/docker-build-cache
          key: ${{ runner.os }}-runtime-images-${{ hashFiles('uv.lock', 'deploy/onebot-bridge.lock', 'Dockerfile', 'deploy/onebot-bridge.Dockerfile', 'deploy/source-reader.Dockerfile', 'deploy/console-ui.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-runtime-images-${{ hashFiles('uv.lock', 'deploy/onebot-bridge.lock', 'Dockerfile', 'deploy/onebot-bridge.Dockerfile', 'deploy/source-reader.Dockerfile', 'deploy/console-ui.Dockerfile') }}-
      - name: Prepare the committed public build context
        run: |
          python -B scripts/ci_container_artifacts.py prepare .local/container-build/source
          docker buildx create --name companion-ci --driver docker-container --use
          docker buildx inspect --bootstrap companion-ci
      # Reproduce public archive extraction with an owner-only migration directory.
      - run: chmod 700 .local/container-build/source/migrations/versions
      - run: python -B scripts/ci_container_artifacts.py build core --context .local/container-build/source --cache .local/docker-build-cache
      - run: chmod 755 .local/container-build/source/migrations/versions
      - name: Exercise isolated dev Compose with the existing Core image
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' companion-core:test)
          python -B -m scripts.smoke_dev_compose --context default --image "$image_id"
      - name: Preserve dev Compose container evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-compose-smoke-${{ github.run_attempt }}
          path: .local/verification/dev-compose-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: docker build -f deploy/executor.Dockerfile -t companion-executor:test .
      - run: python -B scripts/ci_container_artifacts.py build reader --context .local/container-build/source --cache .local/docker-build-cache
      - run: docker build -f deploy/file-parser.Dockerfile -t companion-file-parser:test .
      - name: Parse synthetic documents in the isolated native worker
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' companion-file-parser:test)
          python scripts/smoke_file_parser.py --image "$image_id"
      - run: python -B scripts/ci_container_artifacts.py build bridge --context .local/container-build/source --cache .local/docker-build-cache
      - name: Import the shared contract from the isolated Bridge image
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 256m --pids-limit 64
          --entrypoint python companion-onebot-bridge:review -c
          "import importlib.util; import companion_meme_protocol as contract;
          from companion_onebot_bridge.meme_caption import CaptionResult;
          from companion_onebot_bridge import owner_resolution;
          import companion_delivery_protocol as wire;
          assert owner_resolution.wire is wire;
          assert CaptionResult is contract.CaptionResult;
          assert importlib.util.find_spec('companion') is None"
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 256m --pids-limit 64
          companion-onebot-bridge:review --help
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 256m --pids-limit 64
          -v companion-onebot-smoke:/bridge-data
          -v "${{ github.workspace }}/scripts/smoke_onebot.py:/app/verify.py:ro"
          --entrypoint python companion-onebot-bridge:review /app/verify.py
      # Root only prepares a deliberately incompatible test volume; bridge stays UID 10004.
      - run: >-
          docker run --rm --network none --read-only --user 0:0
          -v companion-onebot-wrong-owner:/bridge-data
          --entrypoint python companion-onebot-bridge:review
          -c "import os; from pathlib import Path; Path('/bridge-data/legacy.sentinel').write_text('SYNTHETIC'); os.chown('/bridge-data',0,0); os.chmod('/bridge-data',0o700)"
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 256m --pids-limit 64
          --mount type=volume,source=companion-onebot-wrong-owner,target=/bridge-data,volume-nocopy
          -v "${{ github.workspace }}/scripts/smoke_onebot.py:/app/verify.py:ro"
          --entrypoint python companion-onebot-bridge:review /app/verify.py --wrong-owner
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 768m --pids-limit 96
          --tmpfs /scratch:rw,nosuid,nodev,size=128m,uid=10003,gid=10003,mode=0700
          companion-source-reader:test --help
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --cpus 1 --memory 768m --pids-limit 96
          --tmpfs /scratch:rw,nosuid,nodev,size=128m,uid=10003,gid=10003,mode=0700
          -v "${{ github.workspace }}/scripts/smoke_plugin_readonly.py:/app/verify.py:ro"
          --entrypoint python companion-source-reader:test /app/verify.py
      - run: >-
          docker run --rm --network none --entrypoint python companion-executor:test
          -c "import companion.executor_gateway, companion.executor_budget_proxy, companion.dsh_job"
      - run: >-
          docker run --rm --network none --user 10002:10002 --read-only
          --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 64
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          --tmpfs /scratch:rw,nosuid,nodev,exec,size=768m,uid=10002,gid=10002,mode=0700
          -v "${{ github.workspace }}/scripts/smoke_executor.py:/verify.py:ro"
          --entrypoint python companion-executor:test /verify.py
      - run: >-
          docker run --rm
          -e COMPANION_OWNER_QQ_ID=10001 -e COMPANION_BOT_QQ_ID=10002
          -e COMPANION_BRIDGE_TOKEN=container-test-token-32-characters
          -e COMPANION_MODE=demo
          -e COMPANION_MEMORY_ENABLED=true
          -e COMPANION_DIARY_ENABLED=true
          -e COMPANION_DATABASE=/data/test.sqlite3
          -e COMPANION_ERASURE_LEDGER=/privacy/test.jsonl
          -e COMPANION_EMBEDDING_CACHE_DIR=/data/embedding-cache
          companion-core:test init
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-3.12
      - name: Prepare native Linux console proxy checks
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          nginx -v
          uv sync --frozen --group reader
      - name: Validate the UI image, proxy contracts and isolated UI replacement
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          created=()
          network="console-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            for container in "${created[@]}"; do
              docker rm -f "$container" >/dev/null 2>&1 || true
            done
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python -B scripts/ci_container_artifacts.py build ui --context .local/container-build/source --cache .local/docker-build-cache
          baseline=.local/console-ui-baseline
          mkdir -p "$baseline/deploy" "$baseline/companion/console_static"
          cp deploy/console-ui.Dockerfile deploy/console-ui.nginx.conf "$baseline/deploy/"
          cp companion/console_static/{index.html,app.js,app.css,icon.svg} "$baseline/companion/console_static/"
          printf '\n/* Synthetic UI rollback baseline */\n' >> "$baseline/companion/console_static/app.css"
          docker build -f "$baseline/deploy/console-ui.Dockerfile" -t companion-console-ui:synthetic-baseline "$baseline"
          candidate_id=$(docker image inspect --format '{{.Id}}' companion-console-ui:test)
          baseline_id=$(docker image inspect --format '{{.Id}}' companion-console-ui:synthetic-baseline)
          # These bounded synthetic holders prove container identity continuity, not business health.
          protected=()
          for tag in companion-core:test companion-onebot-bridge:review companion-source-reader:test; do
            image_id=$(docker image inspect --format '{{.Id}}' "$tag")
            container=$(docker run -d --label companion.console-synthetic=true --network none \
              --read-only --cap-drop ALL --security-opt no-new-privileges --cpus 0.25 \
              --memory 128m --pids-limit 32 --entrypoint python "$image_id" \
              -c 'import time; time.sleep(600)')
            created+=("$container")
            protected+=("$container")
          done
          docker network create --label companion.console-synthetic=true "$network"
          ui=$(docker run -d --label companion.console-synthetic=true --network "$network" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --cpus 0.25 --memory 64m --pids-limit 32 -p 127.0.0.1::8080 "$candidate_id")
          created+=("$ui")
          address=$(docker port "$ui" 8080/tcp)
          [[ "$address" == 127.0.0.1:* ]]
          COMPANION_TEST_CONSOLE_PROXY=1 COMPANION_TEST_CONSOLE_UI_URL="http://$address" \
            uv run --group reader python -m pytest -q tests/test_console_frontend.py \
            --basetemp=.local/test-temp/console-oci -o cache_dir=.local/test-temp/console-oci-cache \
            --junitxml=.local/test-results/console-oci.xml
          python -B scripts/smoke_console_ui.py --ui-image "$baseline_id" \
            --replacement-ui-image "$candidate_id" --core-container "${protected[0]}" \
            --bridge-container "${protected[1]}" --reader-container "${protected[2]}" \
            --output .local/test-results/console-ui-replacement.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path(".local/test-results/console-ui-replacement.json").read_text()); assert r["protected_unchanged"] and all(r["protected_running"].values())'
      - name: Preserve native UI and proxy results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-ui-native-${{ github.run_attempt }}
          path: |
            .local/test-results/console-oci.xml
            .local/test-results/console-ui-replacement.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Export only the validated public-source runtime images
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        run: python -B scripts/ci_container_artifacts.py export .local/container-build .local/container-images
      - name: Load and inspect the exact exported archives
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        run: python -B scripts/ci_container_artifacts.py load .local/container-images/container-images.json
      - id: core-image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        with:
          name: runtime-image-core-${{ github.run_attempt }}
          path: .local/container-images/core.tar.gz
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: bridge-image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        with:
          name: runtime-image-bridge-${{ github.run_attempt }}
          path: .local/container-images/bridge.tar.gz
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: reader-image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        with:
          name: runtime-image-reader-${{ github.run_attempt }}
          path: .local/container-images/reader.tar.gz
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: ui-image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        with:
          name: runtime-image-ui-${{ github.run_attempt }}
          path: .local/container-images/ui.tar.gz
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Bind immutable Actions artifact identities
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        env:
          CI_CORE_ARTIFACT_ID: ${{ steps.core-image.outputs.artifact-id }}
          CI_CORE_ARTIFACT_DIGEST: ${{ steps.core-image.outputs.artifact-digest }}
          CI_BRIDGE_ARTIFACT_ID: ${{ steps.bridge-image.outputs.artifact-id }}
          CI_BRIDGE_ARTIFACT_DIGEST: ${{ steps.bridge-image.outputs.artifact-digest }}
          CI_READER_ARTIFACT_ID: ${{ steps.reader-image.outputs.artifact-id }}
          CI_READER_ARTIFACT_DIGEST: ${{ steps.reader-image.outputs.artifact-digest }}
          CI_UI_ARTIFACT_ID: ${{ steps.ui-image.outputs.artifact-id }}
          CI_UI_ARTIFACT_DIGEST: ${{ steps.ui-image.outputs.artifact-digest }}
        run: python -B scripts/ci_container_artifacts.py bind .local/container-images/container-images.json
      - id: images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        with:
          name: ci-container-images-${{ github.run_attempt }}
          path: .local/container-images/container-images.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual local archive load timings
        if: ${{ always() && needs.preflight.outputs.profile == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-image-load-${{ github.run_attempt }}
          path: .local/container-images/local-load.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  browser-reader:
    needs: preflight
    if: ${{ (needs.preflight.outputs.profile == 'full' || needs.preflight.outputs.profile == 'selected') && fromJSON(needs.preflight.outputs.windows).browser }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright-browsers
      COMPANION_TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-3.12
      - run: uv sync --frozen --group reader
      - run: uv run --group reader python -m playwright install chromium --only-shell
      - name: Prepare Nginx for console proxy checks
        shell: pwsh
        run: |
          $nginx = ./scripts/check_console_proxy.ps1 -PrepareOnly
          "COMPANION_TEST_NGINX=$nginx" >> $env:GITHUB_ENV
      - name: Validate browser readers and console interactions
        if: ${{ fromJSON(needs.preflight.outputs.windows).product }}
        run: >-
          uv run --group reader python -m pytest -q tests/test_source_browser.py
          tests/test_next_reading_browser.py tests/test_console_frontend.py tests/test_console_browser.py
          tests/test_console_supplement_browser.py --basetemp=.local/test-temp
      - name: Validate console interactions
        if: ${{ !fromJSON(needs.preflight.outputs.windows).product }}
        run: >-
          uv run --group reader python -m pytest -q tests/test_console_frontend.py tests/test_console_browser.py
          tests/test_console_supplement_browser.py --basetemp=.local/test-temp
      - name: Preserve browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: output/playwright/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  plugin-native:
    needs: preflight
    if: ${{ (needs.preflight.outputs.profile == 'full' || needs.preflight.outputs.profile == 'selected') && fromJSON(needs.preflight.outputs.windows).product }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 674537331/astrbot_plugin_xiaoheihe_adapter
          ref: 90d3c9d4d051f912d80ba02b38d5f8f0a5a95aac
          path: .local/p3/upstream/heybox
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: c1overzz/dsh-bili-scroll
          ref: 9a3e0e67d82feedf755c763807c806c4d125a245
          path: .local/p3/upstream/bili
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: docs/design-v0.6/upstream-native-p3.lock
          cache-suffix: python-3.12-native
      - run: uv venv .local/p3/native-venv
      - run: >-
          uv pip sync --python .local/p3/native-venv/bin/python --require-hashes
          docs/design-v0.6/upstream-native-p3.lock
      - run: >-
          .local/p3/native-venv/bin/python scripts/verify_plugin_native.py
          --upstream-root .local/p3/upstream
      - run: mkdir -p .local/test-temp
      - working-directory: .local/p3/upstream/heybox
        run: >-
          ${{ github.workspace }}/.local/p3/native-venv/bin/python -m pytest -q
          tests/test_api_client.py tests/test_request_signing.py tests/test_parsers.py
          tests/test_feed_service.py tests/test_topic_service.py tests/test_permissions.py
          --basetemp=${{ github.workspace }}/.local/test-temp/native
          -o cache_dir=${{ github.workspace }}/.local/p3/pytest-cache
  ci:
    if: ${{ always() }}
    needs: [preflight, quality, test, container, browser-reader, plugin-native]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    env:
      CI_IMAGES_ARTIFACT_ID: ${{ needs.container.outputs.images-artifact-id }}
      CI_IMAGES_ARTIFACT_DIGEST: ${{ needs.container.outputs.images-artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the selected validation to succeed
        env:
          CI_PROFILE: ${{ needs.preflight.outputs.profile }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_WINDOWS: ${{ needs.preflight.outputs.windows }}
          CI_REUSE: ${{ needs.preflight.outputs.reuse }}
          CI_JOB_TIMINGS: 'true'
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py gate --profile "$CI_PROFILE"
      - name: Record the tree after every full check succeeded
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        env:
          CI_PROFILE: ${{ needs.preflight.outputs.profile }}
          CI_WINDOWS: ${{ needs.preflight.outputs.windows }}
        run: python scripts/ci_reuse.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.preflight.outputs.profile == 'full' }}
        with:
          name: ci-full-${{ github.run_attempt }}
          path: .local/ci/verified-tree.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual selection and results, including failures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ci-validation-${{ github.run_attempt }}
          path: .local/ci/validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
