# Example: one TLS reverse proxy on the same host as Core.
# Replace domain/certificate paths; keep the Core socket off the public network.
server {
    listen 443 ssl;
    server_name console.example.test;
    ssl_certificate /etc/letsencrypt/live/console.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.test/privkey.pem;

    # Discard any client-supplied forwarding chain at this single proxy boundary.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /console { return 308 /console/; }
    location /console/ { proxy_pass http://127.0.0.1:8765; }
    location /v1/console/ { proxy_pass http://127.0.0.1:8765; }
    location / { return 404; }
}
