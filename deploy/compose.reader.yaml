# Explicit opt-in. Tokens are scoped observation credentials, never owner/Bridge credentials.
services:
  bilibili-reader: &reader
    profiles: [reader]
    build:
      context: ..
      dockerfile: deploy/source-reader.Dockerfile
    command: [--core-url, "${COMPANION_READER_CORE_URL:?Set a private Core HTTP origin}",
              --adapter-id, "${COMPANION_READER_ID:-bilibili_source}"]
    env_file: ../privacy/reader.env
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 768m
    pids_limit: 96
    tmpfs:
      - /scratch:rw,nosuid,nodev,size=128m,uid=10003,gid=10003,mode=0700
      - /tmp:rw,nosuid,nodev,size=32m
    networks: [reader]
    restart: "no"
  heybox-reader:
    <<: *reader
    profiles: [heybox-reader]
    command: [--source, heybox,
              --core-url, "${COMPANION_READER_CORE_URL:?Set a private Core HTTP origin}",
              --adapter-id, "${COMPANION_HEYBOX_READER_ID:-heybox_source}"]
    env_file: ../privacy/heybox-reader.env
  web-reader:
    <<: *reader
    profiles: [web-reader]
    command: [--source, web, --protocol, reading-v1,
              --core-url, "${COMPANION_READER_CORE_URL:?Set a private Core HTTP origin}",
              --adapter-id, "${COMPANION_WEB_READER_ID:-web_source}"]
    env_file: ../privacy/web-reader.env
  heybox-native-reader:
    <<: *reader
    profiles: [heybox-native]
    command: [--source, heybox, --heybox-native, --account-file, /account/grant.json,
              --core-url, "${COMPANION_READER_CORE_URL:?Set a private Core HTTP origin}",
              --adapter-id, "${COMPANION_HEYBOX_READER_ID:-heybox_source}"]
    env_file: ../privacy/heybox-reader.env
    volumes:
      - type: bind
        source: ${COMPANION_HEYBOX_ACCOUNT_FILE:-../privacy/heybox-account.json}
        target: /account/grant.json
        read_only: true
        bind:
          create_host_path: false
  bilibili-tools-reader:
    <<: *reader
    profiles: [bilibili-tools]
    command: [--bili-tools, --account-file, /account/grant.json,
              --search-keyword, "${COMPANION_BILI_SEARCH_KEYWORD:-独立游戏}",
              --core-url, "${COMPANION_READER_CORE_URL:?Set a private Core HTTP origin}",
              --adapter-id, "${COMPANION_READER_ID:-bilibili_source}"]
    volumes:
      - type: bind
        source: ${COMPANION_BILI_ACCOUNT_FILE:-../privacy/bilibili-account.json}
        target: /account/grant.json
        read_only: true
        bind:
          create_host_path: false
networks:
  reader:
    external: true
    name: ${COMPANION_READER_NETWORK:?Set the isolated development network name}
