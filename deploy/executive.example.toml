# Merge the chosen endpoint into Core config.toml. Every new capability remains off.
[executive]
enabled = false
allow_changes = false
daily_calls = 0
daily_micro_usd = 0
monthly_micro_usd = 0
timeout_seconds = 45

[executive.endpoints.windows]
url = "http://100.64.0.10:8090"
token = "replace-with-a-distinct-random-executor-token"
workspace = "deliverables"
capabilities = ["windows.read_text"]
max_cost_micro_usd = 0

[executive.endpoints.dsh]
url = "http://172.30.91.10:8090"
token = "replace-with-a-second-random-executor-token"
workspace = "scratch"
capabilities = ["dsh.run"]
max_cost_micro_usd = 50000
max_model_calls = 3
max_input_bytes = 16000
max_output_tokens = 1024
