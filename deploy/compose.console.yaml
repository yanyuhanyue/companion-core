# Optional: -f compose.yaml -f deploy/compose.console.yaml.
# Host TLS Nginx uses deploy/console.nginx.conf; no public static backend port.
# Build separately, verify, then set COMPANION_CONSOLE_UI_IMAGE to its OCI digest.
services:
  console-ui:
    image: ${COMPANION_CONSOLE_UI_IMAGE:?set the verified UI image digest}
    ports: ["127.0.0.1:8766:8080"]
    networks: [console-static]
    user: "101:101"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
networks:
  console-static:
    driver: bridge
