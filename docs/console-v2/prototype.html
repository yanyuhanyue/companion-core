<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>主人控制台（新版设计原型）- Companion</title>
<style>
/* ===== Tokens ===================================================== */
:root {
  --ink: #23264a;          /* 墨蓝：侧栏、主按钮、正文标题 */
  --ink-2: #2e325c;
  --ink-soft: #3b4070;
  --text: #262a40;
  --muted: #6c7190;
  --faint: #9aa0bb;
  --canvas: #eceef3;       /* 雾灰底 */
  --surface: #fafbfd;
  --raised: #ffffff;
  --line: #dfe2ec;
  --line-strong: #c9cddc;
  --lamp: #f0b429;         /* 灯光黄：只用于“现在”和陪伴者在场 */
  --lamp-soft: #fdf3d8;
  --moss: #2f8a62;  --moss-soft: #e3f2ea;
  --amber: #b06f12; --amber-soft: #fbefd9;
  --rose: #c24164;  --rose-soft: #fbe6ec;
  --sky: #3a6fb0;   --sky-soft: #e4edf8;

  --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --num: "Bahnschrift", "DIN Alternate", "Barlow", "Segoe UI", sans-serif;

  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  --shadow: 0 1px 0 rgba(35,38,74,.04), 0 6px 20px -12px rgba(35,38,74,.28);
  font-family: var(--sans);
  color: var(--text);
  background: var(--canvas);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; font-stretch: 92%; letter-spacing: .01em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ===== Buttons & controls ========================================= */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: var(--ink-2); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: rgba(35,38,74,.06); color: var(--text); }
.btn.danger { color: var(--rose); border-color: #e9bccb; }
.btn.danger.solid { background: var(--rose); color: #fff; border-color: var(--rose); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--muted); }
.icon-btn:hover { background: rgba(35,38,74,.07); color: var(--text); }

.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; }
.field small { color: var(--muted); font-size: 12px; }
.input, select.input, textarea.input { width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); }
textarea.input { height: auto; min-height: 120px; padding: 10px 12px; resize: vertical; line-height: 1.7; }
.input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(35,38,74,.12); }

.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: #e2e5ee; gap: 2px; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 7px; font-size: 13px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(35,38,74,.15); }
.seg button .count { margin-left: 4px; font-family: var(--num); color: var(--faint); }

.switch { position: relative; width: 38px; height: 22px; border-radius: 11px; background: #cfd3e0; border: 0; padding: 0; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* status tag: small dot + word; color carries state */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag.ok { color: var(--moss); } .tag.warn { color: var(--amber); } .tag.bad { color: var(--rose); } .tag.run { color: var(--sky); } .tag.off { color: var(--faint); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #e7e9f1; color: var(--ink-soft); font-size: 12px; white-space: nowrap; }

/* ===== Shell ======================================================= */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--ink); color: #d9dcf0; display: flex; flex-direction: column; padding: 18px 14px 14px; gap: 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; text-decoration: none; color: #fff; }
.brand-mark { width: 28px; height: 28px; position: relative; flex: none; }
.brand-mark i { position: absolute; width: 18px; height: 18px; border-radius: 50%; top: 5px; }
.brand-mark i:first-child { left: 0; background: #fff; opacity: .92; }
.brand-mark i:last-child { right: 0; background: var(--lamp); mix-blend-mode: multiply; }
.brand b { font-family: var(--serif); font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.brand small { display: block; font-size: 11px; color: #9ea3c9; font-weight: 400; margin-top: -2px; }

.presence { border-radius: var(--r-lg); background: var(--ink-2); padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; }
.presence .orb { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe7a3, var(--lamp) 60%, #c98d0c); box-shadow: 0 0 0 4px rgba(240,180,41,.16), 0 0 22px rgba(240,180,41,.35); }
.presence.paused .orb { background: radial-gradient(circle at 35% 35%, #d4d7ea, #8f94b8); box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
.presence strong { color: #fff; font-size: 14px; }
.presence span { font-size: 12px; color: #a9aed3; }
.presence p { grid-column: 1 / -1; margin-top: 8px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12.5px; color: #c7cbe6; line-height: 1.6; }

.nav { display: grid; gap: 2px; }
.nav-group { font-size: 12px; color: #858ab4; padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 10px; border-radius: 9px; text-decoration: none; color: #c9cce6; font-size: 13.5px; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a[aria-current="page"] { background: #fff; color: var(--ink); font-weight: 700; }
.nav a .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--lamp); color: var(--ink); font: 700 11px/20px var(--num); text-align: center; }
.nav a .badge.bad { background: #ef7d98; color: #fff; }

.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); }
.side-foot div { flex: 1; min-width: 0; font-size: 12px; color: #a9aed3; line-height: 1.45; }
.side-foot strong { display: block; color: #fff; font-size: 13px; }
.side-foot .icon-btn { color: #a9aed3; }
.side-foot .icon-btn:hover { background: rgba(255,255,255,.08); color: #fff; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 32px; background: rgba(236,238,243,.88); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top .crumb { font-size: 13px; color: var(--muted); }
.top .crumb b { color: var(--text); font-weight: 600; }
.search-btn { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 36px; width: min(320px, 34vw); padding: 0 10px 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--faint); font-size: 13px; }
.search-btn kbd { margin-left: auto; font: 600 11px var(--num); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 6px; }
.conn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); padding: 0 6px; white-space: nowrap; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--moss); box-shadow: 0 0 0 3px var(--moss-soft); }
.conn.off i { background: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
.menu-btn { display: none; }

.page { padding: 8px 32px 48px; max-width: 1320px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 18px 0 22px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--serif); font-size: 30px; line-height: 1.3; font-weight: 700; color: var(--ink); letter-spacing: .01em; }
.page-head p { color: var(--muted); margin-top: 4px; max-width: 60ch; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.foot-note { margin-top: 36px; color: var(--faint); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ===== Generic sections =========================================== */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
.sheet-head h2 { font-size: 15px; font-weight: 700; color: var(--ink); }
.sheet-head .link { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
.sheet-head .link:hover { text-decoration: underline; }
.sheet-body { padding: 14px 20px 18px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
.stack { display: grid; gap: 18px; align-content: start; }
.rows > li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 13px; }
.kv:first-child { border-top: 0; }
.kv > span:first-child { color: var(--muted); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.empty h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { position: relative; flex: 1 1 220px; max-width: 340px; }
.toolbar .search svg { position: absolute; left: 11px; top: 10px; color: var(--faint); }
.toolbar .search .input { padding-left: 36px; }
.toolbar .spacer { flex: 1; }

/* ===== Table ======================================================= */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr { cursor: pointer; }
.t tbody tr:hover td { background: #f2f3f8; }
.t td.r, .t th.r { text-align: right; }
.t .title-cell { font-weight: 600; color: var(--text); max-width: 420px; }
.t .title-cell small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
</style>
<style>
/* ===== Overview: 今日时间带（本设计的主角） ======================== */
.day { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px 16px; box-shadow: var(--shadow); }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.day-head h2 { font-family: var(--serif); font-size: 20px; color: var(--ink); }
.day-head .sum { font-size: 13px; color: var(--muted); }
.day-head .sum b { font-family: var(--num); color: var(--text); font-size: 15px; margin: 0 2px; }
.day-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
.day-grid { position: relative; min-width: 760px; display: grid; grid-template-columns: 72px 1fr; padding: 22px 30px 0 0; }
.lane-label { font-size: 12px; color: var(--muted); height: 34px; display: flex; align-items: center; }
.lane { position: relative; height: 34px; border-top: 1px solid var(--line); }
.lane:first-of-type { border-top: 0; }
.quiet { position: absolute; top: 0; bottom: 22px; background: repeating-linear-gradient(135deg, rgba(35,38,74,.045) 0 6px, transparent 6px 12px); border-radius: 6px; pointer-events: none; }
.quiet span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; color: var(--muted); background: var(--raised); padding: 1px 8px; border-radius: 5px; white-space: nowrap; }
.ruler { grid-column: 2; position: relative; height: 22px; border-top: 1px solid var(--line-strong); }
.ruler span { position: absolute; top: 4px; transform: translateX(-50%); font: 500 11px var(--num); color: var(--faint); }
.ruler span:first-child { transform: none; }
.mark { position: absolute; top: 8px; height: 18px; min-width: 6px; border-radius: 4px; border: 0; padding: 0; transform: translateX(-3px); }
.mark.group { min-width: 18px; display: grid; place-items: center; }
.mark.group b { font: 700 10.5px/1 var(--num); color: #fff; }
.mark:hover, .mark:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 3; }
.mark.chat { background: #8b90c4; } .mark.proactive { background: var(--ink); } .mark.diary { background: #7aa98f; }
.mark.reading { background: #6e9bd0; } .mark.cost { background: var(--amber); } .mark.bad { background: var(--rose); }
.now { position: absolute; top: -6px; bottom: 18px; width: 2px; background: var(--lamp); border-radius: 2px; z-index: 2; pointer-events: none; }
.now::before { content: ""; position: absolute; top: -4px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 4px rgba(240,180,41,.25); }
.now b { position: absolute; top: -9px; left: 10px; font: 700 11px var(--num); color: #8a6200; background: var(--lamp-soft); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.future { position: absolute; top: 0; bottom: 22px; right: 0; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55) 30px); pointer-events: none; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 8px 10px; border-radius: 8px; max-width: 260px; line-height: 1.5; box-shadow: 0 8px 24px rgba(35,38,74,.3); }
.tip b { display: block; font-weight: 600; }
.tip-line + .tip-line { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.12); }
.tip span { color: #b8bce0; }
@media (prefers-reduced-motion: no-preference) {
  .day.enter .mark { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--d) * 14ms + 120ms); }
  .day.enter .now { animation: glow 1.2s ease-out .5s both; }
  @keyframes rise { from { opacity: 0; transform: translate(-3px, 8px) scaleY(.4); } }
  @keyframes glow { from { opacity: 0; } }
}

/* 等你处理 */
.todo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 18px 0; }
.todo-item { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--amber); }
.todo-item.bad { border-left-color: var(--rose); }
.todo-item.info { border-left-color: var(--sky); }
.todo-item .n { grid-row: span 2; font: 600 30px/1 var(--num); color: var(--ink); align-self: center; min-width: 30px; }
.todo-item h3 { font-size: 13.5px; font-weight: 700; }
.todo-item p { font-size: 12px; color: var(--muted); }
.todo-item .btn { grid-column: 2; justify-self: start; margin-top: 8px; }
.todo-clear { margin: 18px 0; padding: 14px 18px; border-radius: var(--r-md); background: var(--moss-soft); color: #1f6847; font-weight: 600; display: flex; gap: 10px; align-items: center; }

/* 费用 */
.money-big { display: flex; align-items: baseline; gap: 8px; }
.money-big b { font: 600 44px/1 var(--num); color: var(--ink); letter-spacing: -.01em; }
.money-big span { color: var(--muted); font-size: 13px; }
.bar { display: flex; height: 10px; border-radius: 5px; background: #e6e8f0; overflow: hidden; margin: 16px 0 10px; }
.bar i { display: block; height: 100%; }
.bar .s { background: var(--ink); } .bar .r { background: #8b90c4; } .bar .u { background: var(--amber); }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.legend div { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.legend div::before { content: ""; width: 10px; height: 4px; border-radius: 2px; background: var(--c); }
.legend b { font: 600 15px var(--num); color: var(--text); }
.alert { display: flex; gap: 10px; padding: 11px 13px; border-radius: 9px; background: var(--amber-soft); color: #7a4c0a; font-size: 12.5px; margin-bottom: 12px; }
.alert.bad { background: var(--rose-soft); color: #8e2645; }
.alert svg { margin-top: 2px; }
.queues { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); margin-top: 16px; }
.queues div { padding: 14px 0 2px; }
.queues div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.queues b { display: block; font: 600 24px/1.1 var(--num); color: var(--ink); }
.queues span { font-size: 12px; color: var(--muted); }

.caps { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.caps .kv { font-size: 12.5px; }

.recent li .ic { width: 30px; height: 30px; border-radius: 9px; background: #eceef6; color: var(--ink-soft); display: grid; place-items: center; flex: none; }
.recent li .txt { flex: 1; min-width: 0; }
.recent li .txt b { display: block; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent li .txt span { font-size: 12px; color: var(--muted); }
.recent time { font: 500 12px var(--num); color: var(--faint); }

/* ===== Activity ==================================================== */
.tl-day { display: grid; grid-template-columns: 120px 1fr; gap: 0 20px; }
.tl-day + .tl-day { margin-top: 26px; }
.tl-date { position: sticky; top: 76px; align-self: start; }
.tl-date b { display: block; font-family: var(--serif); font-size: 18px; color: var(--ink); }
.tl-date span { font-size: 12px; color: var(--muted); }
.tl-list { border-left: 2px solid var(--line); padding-left: 0; }
.tl-item { position: relative; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: start; padding: 12px 16px 12px 22px; border-radius: 0 10px 10px 0; cursor: pointer; background: none; border: 0; text-align: left; width: 100%; }
.tl-item:hover, .tl-item[aria-expanded="true"] { background: var(--surface); }
.tl-item::before { content: ""; position: absolute; left: -6px; top: 19px; width: 10px; height: 10px; border-radius: 50%; background: var(--canvas); border: 2px solid var(--k, var(--line-strong)); }
.tl-item time { font: 500 13px var(--num); color: var(--muted); padding-top: 1px; }
.tl-item b { font-weight: 600; display: block; }
.tl-item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.tl-item .meta code { font-family: var(--num); color: var(--faint); }
.tl-more { grid-column: 2 / -1; display: none; margin-top: 10px; padding: 12px 14px; border-radius: 9px; background: var(--raised); border: 1px solid var(--line); font-size: 12.5px; }
.tl-item[aria-expanded="true"] .tl-more { display: block; }

/* ===== Memories ==================================================== */
.mem-list { display: grid; gap: 12px; }
.mem { display: grid; grid-template-columns: 1fr auto; gap: 10px 20px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.mem.review { background: var(--raised); border-color: #e9d29b; box-shadow: inset 4px 0 0 var(--lamp); }
.mem h3 { font-size: 15.5px; font-weight: 600; line-height: 1.6; color: var(--text); }
.mem .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); }
.mem .acts { display: flex; gap: 6px; align-items: start; }
.quote { grid-column: 1 / -1; font-family: var(--serif); font-size: 13.5px; color: var(--ink-soft); padding: 10px 14px; border-radius: 8px; background: #f0f1f7; line-height: 1.75; }
.quote small { display: block; font-family: var(--sans); font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.quote mark { background: var(--lamp-soft); color: inherit; padding: 0 2px; border-radius: 3px; }

/* ===== Life & diary ================================================ */
.diary-wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.cal { padding: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head b { font-family: var(--serif); font-size: 16px; color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-grid .wd { font-size: 11px; color: var(--faint); padding: 4px 0; }
.cal-grid button { position: relative; aspect-ratio: 1; border: 0; border-radius: 8px; background: transparent; font: 500 13px var(--num); color: var(--faint); }
.cal-grid button.has { color: var(--text); background: #eef0f6; }
.cal-grid button.has::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #7aa98f; }
.cal-grid button.fail::after { background: var(--rose); }
.cal-grid button.today { box-shadow: inset 0 0 0 1.5px var(--lamp); color: var(--text); }
.cal-grid button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.cal-grid button:disabled { cursor: default; }
.cal-legend { display: flex; gap: 14px; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
.paper { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px 36px 26px; box-shadow: var(--shadow); }
.paper-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.paper-head h2 { font-family: var(--serif); font-size: 22px; color: var(--ink); }
.paper-head p { font-size: 12px; color: var(--muted); }
.paper-body { font-family: var(--serif); font-size: 16px; line-height: 2; color: #2b2f48; max-width: 38em; }
.paper-body p + p { margin-top: 1em; text-indent: 0; }
.paper-foot { margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--line); display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.goal { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.goal:first-child { border-top: 0; }
.goal b { font-weight: 600; font-size: 13.5px; }
.goal p { font-size: 12px; color: var(--muted); grid-column: 1; }
.goal .tag { grid-row: 1; grid-column: 2; }
.progress { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: #e6e8f0; overflow: hidden; }
.progress i { display: block; height: 100%; background: #7aa98f; }

/* ===== Memes ======================================================= */
.memes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.meme { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; cursor: pointer; text-align: left; padding: 0; }
.meme:hover { border-color: var(--line-strong); }
.meme .pic { aspect-ratio: 1; display: grid; place-items: center; font-size: 46px; position: relative; }
.meme .pic .tag { position: absolute; left: 8px; top: 8px; background: rgba(255,255,255,.92); padding: 2px 8px; border-radius: 6px; }
.meme .cap { padding: 10px 12px 12px; }
.meme .cap b { font-size: 13px; font-weight: 600; display: block; }
.meme .cap span { font-size: 11.5px; color: var(--muted); }
.meme.quarantined .pic { filter: grayscale(1) blur(3px); opacity: .55; }

/* ===== Voice / account ============================================ */
.nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 18px; }
.node { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.node h3 { font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.node .kv { font-size: 12.5px; }
.wave { display: flex; align-items: center; gap: 2px; height: 22px; }
.wave i { width: 3px; border-radius: 2px; background: #a5aad3; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.compare > div { padding: 14px 18px; }
.compare > div + div { border-left: 1px dashed var(--line-strong); }
.compare h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.compare p { font-size: 13.5px; }
.acct { margin-bottom: 14px; }
.acct-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.acct-top b { font-size: 14px; }

/* ===== Diagnostics ================================================= */
.procs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; }
.proc { padding: 16px 20px; border-left: 1px solid var(--line); }
.proc:first-child { border-left: 0; }
.proc b { font-size: 13.5px; display: block; margin-bottom: 6px; }
.beats { display: flex; gap: 2px; margin: 10px 0 6px; }
.beats i { flex: 1; height: 18px; border-radius: 2px; background: var(--moss); opacity: .75; }
.beats i.miss { background: #dfe2ec; opacity: 1; }
.beats i.err { background: var(--rose); }
.proc small { font-size: 11.5px; color: var(--muted); }

/* ===== Save bar ================================================== */
.savebar { position: sticky; bottom: 16px; margin-top: 18px; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-radius: 12px; background: var(--ink); color: #fff; box-shadow: 0 12px 30px -10px rgba(35,38,74,.6); }
.savebar p { flex: 1; font-size: 13px; color: #d6d9f0; }
.savebar .btn.quiet { color: #c7cbe6; }
.savebar .btn.quiet:hover { background: rgba(255,255,255,.08); color: #fff; }
.savebar .btn.primary { background: var(--lamp); border-color: var(--lamp); color: var(--ink); }

/* ===== 能力与开关 ================================================= */
.cap-group + .cap-group { margin-top: 28px; }
.cap-group h2 { font-family: var(--serif); font-size: 18px; color: var(--ink); margin-bottom: 10px; display: flex; align-items: baseline; gap: 12px; }
.cap-group h2 span { font: 500 12px var(--sans); color: var(--muted); }
.cap-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.cap + .cap { border-top: 1px solid var(--line); }
.cap-main { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-start; padding: 16px 20px; }
.cap-txt { flex: 1 1 320px; min-width: 0; }
.cap-meter { flex: 0 0 200px; }
.cap-acts { flex: 0 0 auto; margin-left: auto; }
.cap-main > .switch { margin-top: 2px; }
.cap.off .cap-txt h3, .cap.off .cap-txt > p { color: var(--muted); }
.cap-txt h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cap-txt > p { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.needs { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.needs li { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.needs li svg { width: 14px; height: 14px; stroke-width: 2.2; }
.needs li.ok { color: var(--moss); } .needs li.no { color: var(--rose); }
.lockline, .warnline { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; }
.lockline { color: var(--muted); } .warnline { color: var(--amber); }
.lockline svg, .warnline svg { width: 15px; height: 15px; }
.lampchip { background: var(--lamp-soft); color: #7a5600; }
.cap-meter { font-size: 12px; color: var(--muted); display: grid; gap: 5px; padding-top: 2px; }
.cap-meter b { color: var(--text); font-size: 13px; }
.cap-meter small { font-size: 11px; color: var(--faint); }
.mbar { height: 6px; border-radius: 3px; background: #e6e8f0; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--ink-soft); border-radius: 3px; }
.mbar.high i { background: var(--amber); } .mbar.full i { background: var(--rose); }
.mbar.big { height: 10px; border-radius: 5px; margin: 10px 0 16px; }
.cap-acts { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.cap-acts .chev { width: 14px; height: 14px; transform: rotate(90deg); }
.cap-acts [aria-expanded="true"] .chev { transform: rotate(90deg) scaleX(-1); }
.cap-params { padding: 4px 20px 16px 76px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 28px; background: linear-gradient(#f4f5f9, var(--surface) 30px); border-top: 1px dashed var(--line); }
@media (prefers-reduced-motion: no-preference) { .cap-params { animation: unfold .2s ease-out; } @keyframes unfold { from { opacity: 0; transform: translateY(-4px); } } }

/* 参数行：标签在左，控件在右 */
.pf { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.pf-l b { display: block; font-size: 13px; font-weight: 600; }
.pf-l span { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }
.pf-l code, code.key { display: none; font: 400 11px var(--num); color: var(--faint); margin-top: 1px; }
.pf-c { display: flex; justify-content: flex-end; }
.pf-c .input { width: 230px; }
.pf-c select.hour { width: 110px; }
.pf.changed .pf-l b::after, .price.changed span::after { content: "已修改"; margin-left: 8px; font: 600 11px var(--sans); color: #7a5600; background: var(--lamp-soft); padding: 1px 6px; border-radius: 4px; }
.pf-list .pf:last-child { border-bottom: 0; }
.unit { position: relative; display: inline-block; width: 150px; max-width: none; }
.unit .input { width: 100% !important; padding-right: 12px; text-align: right; font-family: var(--num); font-size: 14px; }
.unit em { position: static; display: none; }
.unit:has(em) { width: auto; display: inline-flex; align-items: center; gap: 8px; }
.unit:has(em) .input { width: 110px !important; }
.unit:has(em) em { display: inline; font-style: normal; color: var(--muted); font-size: 12px; white-space: nowrap; }
.unit.has-pre i { position: absolute; left: 11px; top: 9px; font-style: normal; color: var(--muted); font: 500 14px var(--num); z-index: 1; }
.unit.has-pre .input { padding-left: 24px; }

/* ===== 配置 ======================================================== */
.cfg2 { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; align-items: start; }
.cfg-toc { position: sticky; top: 76px; display: grid; gap: 2px; }
.cfg-toc a { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
.cfg-toc a:hover { background: rgba(35,38,74,.05); color: var(--text); }
.cfg-toc .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); }
.cfg-main { display: grid; gap: 18px; min-width: 0; }
.cfg-sec { scroll-margin-top: 76px; }
.cfg-sec .sheet-head h2 { font-family: var(--serif); font-size: 18px; }
h3.sub { font-size: 13px; font-weight: 700; margin: 18px 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
h3.sub span { font-weight: 400; color: var(--muted); font-size: 12px; }

.vchain { display: flex; gap: 0; overflow-x: auto; padding: 4px 0 2px; }
.vchain li { flex: 1 0 150px; position: relative; padding-right: 18px; }
.vchain li::after { content: ""; position: absolute; top: 19px; left: 40px; right: 0; height: 2px; background: var(--line-strong); }
.vchain li:last-child::after { display: none; }
.vchain li > * { position: relative; z-index: 1; display: grid; gap: 1px; text-align: left; background: none; border: 0; padding: 0; }
.vchain b { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); border: 2px solid var(--line-strong); color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.vchain li > * > span { font-size: 13px; font-weight: 700; }
.vchain small { font-size: 11.5px; color: var(--muted); }
.vchain button:hover b { border-color: var(--ink); }
.vchain .active b { background: var(--ink); border-color: var(--ink); color: #fff; }
.vchain .pending b { background: var(--lamp); border-color: var(--lamp); color: var(--ink); box-shadow: 0 0 0 4px rgba(240,180,41,.2); }
.vchain .next b { border-style: dashed; background: transparent; }
.vchain .next span span { color: var(--muted); font-weight: 500; }
.apply { margin-top: 18px; padding: 16px 18px; border-radius: 12px; background: var(--lamp-soft); display: flex; gap: 18px; justify-content: space-between; flex-wrap: wrap; }
.apply h3 { font-size: 14px; color: #5f4300; }
.apply .note { color: #7a5c1c; }
.steps { list-style: decimal; padding-left: 20px; margin-top: 8px; font-size: 13px; color: #4e3a08; display: grid; gap: 2px; }
.apply-acts { display: flex; gap: 8px; align-items: flex-start; }

.prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 6px; }
.price { padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); display: grid; gap: 8px; }
.price > span { font-size: 12.5px; font-weight: 600; }
.price .unit { width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.price .unit .input { width: 100% !important; font-size: 18px; height: 44px; }
.price .unit.has-pre i { top: 12px; font-size: 18px; }
.price .unit em { text-align: right; }
.estimate { display: flex; gap: 10px; align-items: center; margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #eef0f7; font-size: 13px; }
.estimate b { font-size: 15px; color: var(--ink); }

.clock { position: relative; height: 86px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); margin-top: 4px; overflow: hidden; }
.cband { position: absolute; top: 0; bottom: 24px; background: repeating-linear-gradient(135deg, rgba(35,38,74,.08) 0 6px, transparent 6px 12px); transition: left .25s, width .25s; }
.cnow { position: absolute; top: 0; bottom: 24px; width: 2px; background: var(--lamp); }
.cticks { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; border-top: 1px solid var(--line-strong); }
.cticks span { position: absolute; top: 4px; transform: translateX(-50%); font: 500 11px var(--num); color: var(--faint); }
.cticks span:first-child { transform: none; margin-left: 4px; } .cticks span:last-child { transform: translateX(-100%); margin-left: -4px; }
.pin { position: absolute; top: 10px; transform: translateX(-50%); display: grid; justify-items: center; gap: 3px; transition: left .25s; }
.pin i { width: 12px; height: 12px; border-radius: 50%; background: #7aa98f; box-shadow: 0 0 0 3px var(--raised); }
.pin span { font-size: 11.5px; font-weight: 600; background: var(--raised); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.pin.cons { top: 34px; } .pin.cons i { background: var(--ink-soft); } .pin.off { opacity: .45; }

.budget-block { padding: 16px 0; border-top: 1px solid var(--line); }
.budget-block:first-child { border-top: 0; padding-top: 4px; }
.bb-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.bb-head h3 { font-size: 14px; font-weight: 700; }
.bigline { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; }
.bigline b { font: 600 34px/1 var(--num); color: var(--ink); }
.bigline span { color: var(--muted); font-size: 13px; }
.cloud-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.cloud-grid .unit, .cloud-grid .unit:has(em) { width: 100%; }
.cloud-grid .unit:has(em) .input { width: 100% !important; }
.bb-acts { display: flex; gap: 8px; margin-top: 14px; }
.month { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px 16px; margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
.month b { font-size: 16px; color: var(--ink); }
.month .unit { justify-self: end; }
.month .mbar { grid-column: 1 / -1; }
.scen { margin-top: 8px; }
.scen tbody tr { cursor: default; }
.scen tbody tr:hover td { background: none; }
.scen tr.changed td { background: #fffaf0 !important; }
.scen .mini { display: flex; align-items: center; gap: 10px; max-width: 260px; }
.scen .mini .mbar { flex: 1; }
.scen .mini span { font-size: 12px; color: var(--muted); min-width: 52px; }
.secrets li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
.secrets li:first-child { border-top: 0; }
.secrets .lockic { width: 32px; height: 32px; border-radius: 9px; background: #eceef6; color: var(--ink-soft); display: grid; place-items: center; }
.secrets b { font-size: 13.5px; }
.secrets code { display: block; font: 400 11.5px var(--num); color: var(--faint); }
.sec-r { display: grid; justify-items: end; gap: 4px; }
.sec-r small { font-size: 11.5px; color: var(--muted); }
.diff li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.diff li > b { font-weight: 600; }
.diff li > span { grid-column: 1; color: var(--muted); }
.diff li > code { display: none; grid-column: 1; font: 400 11px var(--num); color: var(--faint); }
.diff li > button { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.diff s { color: var(--faint); }
.diff ins { text-decoration: none; color: var(--ink); font-weight: 700; background: var(--lamp-soft); padding: 0 4px; border-radius: 3px; }
dialog .diff { max-height: 320px; overflow-y: auto; }
.savebar { position: fixed; left: calc(252px + 32px); right: 32px; bottom: 18px; z-index: 30; max-width: 1256px; margin: 0; }
.savebar p b { color: var(--lamp); font-size: 15px; }
.page.has-savebar { padding-bottom: 110px; }

@media (max-width: 1100px) {
  .cfg2 { grid-template-columns: minmax(0, 1fr); }
  .cfg-toc { position: static; display: flex; overflow-x: auto; }
  .cfg-toc a { flex: none; } .cfg-toc p { display: none; }
  .cloud-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .cap-main { padding: 14px 16px; }
  .cap-meter { flex: 1 1 100%; padding-left: 56px; }
  .cap-acts { margin-left: 56px; }
  .cap-params { padding: 4px 16px 14px; grid-template-columns: minmax(0, 1fr); }
  .pf { grid-template-columns: minmax(0, 1fr); }
  .pf-c { justify-content: flex-start; }
  .prices { grid-template-columns: minmax(0, 1fr); }
  .savebar { left: 12px; right: 12px; flex-wrap: wrap; }
  .savebar p { flex-basis: 100%; }
  .secrets li { grid-template-columns: auto minmax(0, 1fr); }
  .sec-r { grid-column: 2; justify-items: start; }
}

/* ===== 能力：列表 + 详情 ========================================== */
.auto-banner { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.auto-banner .ab-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--lamp-soft); color: #9a6a00; flex: none; }
.auto-banner.stopped .ab-ic { background: #e7e9f1; color: var(--faint); }
.auto-banner > div:nth-child(2) { flex: 1 1 320px; display: grid; font-size: 12.5px; color: var(--muted); }
.auto-banner b { font-size: 13.5px; color: var(--text); }
.auto-banner a { color: var(--ink); font-weight: 700; }
.ab-acts { display: flex; gap: 6px; }

.caps2 { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.cap-index { position: sticky; top: 76px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.cap-index .search { position: relative; margin: 12px 12px 8px; }
.cap-index .search svg { position: absolute; left: 11px; top: 10px; color: var(--faint); }
.cap-index .search .input { padding-left: 36px; }
.ci-filter { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
.ci-filter button { border: 1px solid var(--line); background: var(--raised); border-radius: 7px; height: 26px; padding: 0 8px; font-size: 12px; color: var(--muted); }
.ci-filter button span { color: var(--faint); }
.ci-filter button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.ci-filter button[aria-pressed="true"] span { color: #b8bce0; }
.ci-list { overflow-y: auto; padding: 4px 0 10px; }
.ci-ghead { width: 100%; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 10px 14px 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.ci-ghead small { margin-left: auto; font: 500 11px var(--num); color: var(--faint); }
.ci-ghead .chev { width: 13px; height: 13px; transition: transform .15s; }
.ci-ghead[aria-expanded="true"] .chev { transform: rotate(90deg); }
.ci-row { display: flex; align-items: center; gap: 8px; margin: 1px 8px; padding-right: 8px; border-radius: 8px; }
.ci-row:hover { background: #eef0f6; }
.ci-row.sel { background: var(--ink); }
.ci-row.sel .ci-name { color: #fff; font-weight: 700; }
.ci-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; border: 0; background: none; height: 36px; padding: 0 0 0 10px; text-align: left; font-size: 13px; color: var(--text); }
.ci-row.off .ci-name { color: var(--muted); }
.ci-name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.ok { background: var(--moss); } .dot.warn { background: var(--amber); } .dot.bad { background: var(--rose); } .dot.run { background: var(--sky); }
.ci-row.sel .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
.auto-ic { color: #c08a00; display: inline-flex; }
.auto-ic svg { width: 14px; height: 14px; }
.ci-row.sel .auto-ic { color: var(--lamp); }
.pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 3px rgba(240,180,41,.25); }
.switch.sm { width: 30px; height: 18px; }
.switch.sm::after { width: 12px; height: 12px; }
.switch.sm[aria-checked="true"]::after { transform: translateX(12px); }
.ci-row.sel .switch.sm { background: #5b6094; }
.ci-row.sel .switch.sm[aria-checked="true"] { background: var(--lamp); }

.cap-detail { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 26px 26px; box-shadow: var(--shadow); min-width: 0; }
.cd-back { display: none; margin: -6px 0 8px -8px; }
.cd-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.cd-head h2 { font-family: var(--serif); font-size: 24px; color: var(--ink); }
.cd-head p { color: var(--muted); margin-top: 2px; max-width: 52ch; }
.cd-switch { display: grid; justify-items: end; gap: 6px; }
.cd-switch label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.cd-switch code { display: none; }
.cd-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 18px 0 4px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cd-stats > div { padding: 12px 16px; display: grid; gap: 4px; align-content: start; justify-items: start; }
.cd-stats > div + div { border-left: 1px solid var(--line); }
.cd-stats > div > span { font-size: 12px; color: var(--muted); }
.cd-stats b { font-size: 14px; }
.cd-stats small { font-size: 11.5px; color: var(--muted); }
.cd-stats .cap-meter { width: 100%; }
.cd-sec { margin-top: 22px; }
.cd-sec > h3 { font-size: 14px; font-weight: 700; color: var(--ink); display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.cd-sec > h3 span:not(.chip) { font-weight: 400; font-size: 12px; color: var(--muted); }
.cd-sec .needs { margin-top: 10px; }
.cd-sec .pf-list .pf:last-child { border-bottom: 0; }
.pf .ovr { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7a5600; background: var(--lamp-soft); padding: 4px 4px 4px 10px; border-radius: 7px; }
.pf .ovr svg { width: 14px; height: 14px; }
.pf .ovr .btn { margin-left: auto; height: 24px; }

.mode-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.mode-pick button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: grid; gap: 3px; }
.mode-pick button b { font-size: 13px; }
.mode-pick button span { font-size: 12px; color: var(--muted); line-height: 1.5; }
.mode-pick button[aria-checked="true"] { border-color: var(--ink); background: #f3f4fa; box-shadow: inset 0 0 0 1px var(--ink); }
.ck { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 13px; }
.ck input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--ink); flex: none; }
.ck.big { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.ck.big small { display: block; color: var(--muted); font-size: 12px; }
.sub2 { font-size: 12.5px; font-weight: 700; margin: 16px 0 4px; }
.ranges li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; font-size: 13px; }
.ranges li.on .ck span { font-weight: 600; }
.rng { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.rng .input { width: 74px; height: 32px; text-align: right; font-family: var(--num); }
.rng em { font-style: normal; }
.auto-sec .note { margin-top: 12px; }
.clog li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); align-items: start; }
.clog li.prop { background: var(--lamp-soft); margin: 6px -12px; padding: 12px; border-radius: 10px; border: 0; }
.clog b { font-size: 13px; font-weight: 600; }
.clog p { font-size: 12.5px; color: var(--muted); }
.clog small { display: block; font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.who { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.who.it { background: var(--lamp); color: var(--ink); } .who.me { background: var(--ink); color: #fff; }
.clog-r { display: grid; justify-items: end; gap: 6px; }
.clog-r span { display: flex; gap: 6px; }

.pf.wide { grid-template-columns: minmax(0, 1fr); }
.pf.wide .pf-c { justify-content: stretch; }
.pf-hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.pf-hint a { color: var(--ink); font-weight: 600; }
.pf.flash { animation: flash 1.4s ease-out; border-radius: 8px; }
@keyframes flash { 0%, 40% { background: var(--lamp-soft); box-shadow: 0 0 0 8px var(--lamp-soft); } 100% { background: transparent; box-shadow: 0 0 0 8px transparent; } }
.lim { margin-top: 4px; margin-left: -10px; }
.listed { width: 100%; }
.listed ul { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.listed li { display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 2px 0 10px; border-radius: 8px; background: #eef0f6; border: 1px solid var(--line); font: 500 13px var(--num); }
.listed li .icon-btn { width: 24px; height: 24px; }
.listed li .icon-btn svg { width: 14px; height: 14px; }
.listed li.none { background: var(--amber-soft); border-color: transparent; color: #7a4c0a; font-family: var(--sans); padding-right: 10px; }
.list-add { display: flex; gap: 8px; align-items: center; }
.list-add .input { flex: 1; max-width: 420px; height: 34px; }
.list-add small { color: var(--faint); font-size: 12px; }
.list-err { color: var(--rose); font-size: 12px; margin-top: 6px; }
.list-mode { margin-bottom: 4px; }
.listed ul.deny li:not(.none) { background: var(--rose-soft); border-color: #f0cdd8; text-decoration: line-through; text-decoration-color: rgba(194,65,100,.5); }
.listed li.none.ok { background: #eef0f6; color: var(--muted); }
.cfg-toc a[aria-current] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--ink); }
.prop-box { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--lamp-soft); border: 1px solid #f1d58d; }
.prop-box b { font-size: 13.5px; } .prop-box p { font-size: 12.5px; color: #6b5414; } .prop-box small { font-size: 11.5px; color: #8f7433; }
.pb-acts { display: flex; gap: 6px; }
.btn.danger { background: var(--raised); }
.quiet-danger { margin-left: auto; border-color: transparent; }
.mm-big { height: 200px; border-radius: 14px; display: grid; place-items: center; overflow: hidden; }
.mm-big img { max-width: 100%; max-height: 100%; object-fit: contain; }
.mm-state { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 4px; }
.mm-form { display: grid; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mm-form .listed ul { margin-top: 2px; }
.mm-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.meme .pic img { width: 76%; height: 76%; object-fit: contain; }
.meme.unused .pic > span[aria-hidden] { opacity: .45; }
.off-chip { position: absolute; right: 8px; top: 8px; background: rgba(255,255,255,.92); }
.qav.sm { width: 48px; height: 48px; vertical-align: middle; }
.acct-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.vrow.out .vplay { background: var(--lamp); color: var(--ink); }
.vrow.out.playing .vplay { background: var(--ink); color: #fff; }
.vrow.out .vwave i.on { background: #c98d0c; }
/* ===== 记忆关系图 ================================================== */
.gwrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.gcanvas { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.gtools { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.gtypes { display: flex; flex-wrap: wrap; gap: 6px; }
.gtypes button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--muted); }
.gtypes button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.gtypes button[aria-pressed="true"] { color: var(--text); border-color: var(--line-strong); background: var(--raised); }
.gtypes button[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
svg.graph { display: block; width: 100%; height: auto; aspect-ratio: 5 / 3; background: radial-gradient(circle at 50% 50%, #f6f7fb, #fff 70%); touch-action: none; user-select: none; }
.ge path { fill: none; stroke: #b9bdd6; stroke-width: 1.6; transition: opacity .15s; }
.ge.hyp path { stroke-dasharray: 5 5; stroke: #c9a24a; }
.ge.conf path { stroke: var(--rose); stroke-dasharray: 3 4; stroke-width: 2; }
.ge.ctx path { stroke: #dfe2ec; stroke-dasharray: 1 5; stroke-linecap: round; }
.ge.focus path { stroke: var(--lamp); stroke-width: 3.5; stroke-dasharray: none; }
.ge text { font-size: 11.5px; fill: var(--muted); text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.ge.conf text { fill: var(--rose); }
.ge.ctx text { display: none; }
.gn { cursor: grab; outline: none; transition: opacity .15s; }
svg.dragging .gn { cursor: grabbing; }
.gn circle:first-child { stroke-width: 2.5; }
.gn text { font-size: 13px; font-weight: 600; fill: var(--text); text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.gn text.in { fill: #fff; stroke: none; font-size: 15px; }
.gn .pend { fill: var(--lamp); stroke: #fff; stroke-width: 2; }
.gn:hover circle:first-child, .gn:focus-visible circle:first-child { stroke-width: 4; }
.gn.sel circle:first-child { stroke-width: 4; filter: drop-shadow(0 0 8px rgba(240,180,41,.7)); }
.gn.me.sel circle:first-child { stroke: var(--lamp); }
.ge.dim, .gn.dim { opacity: .18; }
.glegend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.glegend span { display: inline-flex; align-items: center; gap: 7px; }
.glegend .l { width: 24px; height: 0; border-top: 2px solid #b9bdd6; }
.glegend .l.dash { border-top: 2px dashed #c9a24a; } .glegend .l.conf { border-top: 2px dashed var(--rose); } .glegend .l.ctx { border-top: 2px dotted #c9cddc; }
.gpanel { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.gpanel h3 { font-family: var(--serif); font-size: 18px; color: var(--ink); }
.gstats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); }
.gstats div { padding: 10px 12px; display: grid; } .gstats div + div { border-left: 1px solid var(--line); }
.gstats b { font-size: 22px; color: var(--ink); } .gstats span { font-size: 12px; color: var(--muted); }
.gsub { font-size: 12.5px; font-weight: 700; margin: 18px 0 8px; color: var(--ink); }
.gtop li button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 6px; border-radius: 8px; font-size: 13px; text-align: left; }
.gtop li button:hover { background: #eef0f6; }
.gtop i { width: 9px; height: 9px; border-radius: 50%; }
.gtop .num { margin-left: auto; color: var(--faint); }
.gp-head { display: flex; gap: 8px; align-items: flex-start; margin-left: -8px; }
.gp-head h3 { margin-bottom: 4px; }
.grel { display: grid; gap: 6px; margin-top: 10px; }
.grel button { width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--raised); border-radius: 9px; padding: 8px 10px; font-size: 13px; text-align: left; }
.grel button:hover { border-color: var(--line-strong); }
.grel em { font-style: normal; font-size: 12px; color: var(--muted); padding: 0 6px; border-radius: 4px; background: #eef0f6; }
.grel li.conf button { border-color: #f0cdd8; background: var(--rose-soft); }
.gmem { padding: 12px 0; border-top: 1px dashed var(--line); display: grid; gap: 8px; }
.gmem b { font-size: 13.5px; font-weight: 600; }
.gmem .meta { display: flex; gap: 8px; align-items: center; }
.gmem .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.gmem.review b { box-shadow: inset 3px 0 0 var(--lamp); padding-left: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .gfirst .ge path { stroke-dashoffset: 0; animation: gdraw .7s ease-out both; animation-delay: calc(var(--i) * 30ms); }
  .gfirst .gn { animation: gpop .35s ease-out both; }
  @keyframes gdraw { from { opacity: 0; } }
  @keyframes gpop { from { opacity: 0; } }
}
@media (max-width: 1100px) { .gwrap { grid-template-columns: minmax(0, 1fr); } .gpanel { position: static; max-height: none; } }

/* ===== 语音播放 ==================================================== */
.vlist { padding: 6px 20px 14px; }
.vrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.vrow:first-child { border-top: 0; }
.vplay { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; }
.vplay svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.vrow.gone .vplay { background: #e2e5ee; color: var(--faint); cursor: not-allowed; }
.vrow.gone .vplay svg { fill: none; stroke: currentColor; }
.vrow.playing .vplay { background: var(--lamp); color: var(--ink); }
.vtop { display: flex; align-items: center; gap: 14px; }
.vwave { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 3px; height: 30px; }
.vwave i { flex: 1; max-width: 5px; border-radius: 2px; background: #c3c7de; transition: background .1s; }
.vwave i.on { background: var(--ink); }
.vrow.gone .vwave i { background: #e2e5ee; }
.vtime { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.vtext { margin-top: 6px; font-family: var(--serif); font-size: 14px; color: #2b2f48; }
.vrow.gone .vtext { color: var(--muted); }
.vmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: var(--muted); align-items: center; }

/* ===== QQ 资料 ===================================================== */
.qcompare { margin-bottom: 14px; }
.qpair { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.qarrow { color: var(--faint); }
.qcard { flex: 1 1 260px; position: relative; display: flex; gap: 14px; align-items: center; padding: 22px 18px 16px; border-radius: 14px; background: linear-gradient(160deg, #f4f5fb, #fff); border: 1px solid var(--line); }
.qlabel { position: absolute; top: 8px; left: 14px; font-size: 11.5px; color: var(--muted); }
.qav { width: 72px; height: 72px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px #fff, 0 2px 10px rgba(35,38,74,.2); }
.qav.diff { box-shadow: 0 0 0 3px var(--lamp), 0 2px 10px rgba(35,38,74,.2); }
.qinfo { display: grid; gap: 2px; min-width: 0; }
.qinfo b { font-size: 16px; }
.qinfo span { font-size: 13px; color: var(--muted); }
.qinfo small { font-size: 11.5px; color: var(--faint); }
.qinfo .diff { background: linear-gradient(transparent 62%, var(--lamp-soft) 62%); color: var(--text); }
.avreview { display: grid; grid-template-columns: 200px 90px minmax(0, 1fr); gap: 20px; padding: 18px; align-items: start; }
.avreview figure { display: grid; gap: 6px; justify-items: center; }
.avreview img { width: 200px; height: 200px; border-radius: 16px; box-shadow: var(--shadow); }
.avreview figure.small img { width: 72px; height: 72px; border-radius: 50%; }
.avreview figcaption { font-size: 12px; color: var(--muted); }
.avreview dl { display: grid; gap: 0; font-size: 13px; }
.avreview dl div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.avreview dt { color: var(--muted); }
.acct-foot { border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

@media (max-width: 1100px) {
  .caps2 { grid-template-columns: 280px minmax(0, 1fr); }
  .mode-pick { grid-template-columns: minmax(0, 1fr); }
  .avreview { grid-template-columns: 160px minmax(0, 1fr); }
  .avreview img { width: 160px; height: 160px; }
  .avreview figure.small { display: none; }
}
@media (max-width: 860px) {
  .caps2 { grid-template-columns: minmax(0, 1fr); }
  .cap-index { position: static; max-height: none; }
  .caps2.show-detail .cap-index, .caps2:not(.show-detail) .cap-detail { display: none; }
  .cd-back { display: inline-flex; }
  .cap-detail { padding: 18px 16px; }
  .cd-stats { grid-template-columns: minmax(0, 1fr); }
  .cd-stats > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .cd-switch { justify-items: start; }
  .avreview { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .avreview dl { width: 100%; }
  .qarrow { transform: rotate(90deg); margin: 0 auto; }
}

/* ===== Drawer / dialog / toast / palette ========================== */
dialog { border: 0; padding: 0; border-radius: 16px; width: min(520px, calc(100vw - 32px)); box-shadow: 0 30px 80px -20px rgba(35,38,74,.5); color: var(--text); }
dialog::backdrop { background: rgba(35,38,74,.38); backdrop-filter: blur(2px); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 0; }
.dlg-head h2 { font-family: var(--serif); font-size: 19px; color: var(--ink); }
.dlg-body { padding: 14px 22px 22px; display: grid; gap: 14px; }
.dlg-body > p { color: var(--muted); font-size: 13px; }
.dlg-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.consequence { display: grid; gap: 6px; padding: 12px 14px; border-radius: 9px; background: #f2f3f8; font-size: 12.5px; }
.consequence li { padding-left: 16px; position: relative; }
.consequence li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.radio-list { display: grid; gap: 8px; }
.radio-list label { display: flex; gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.radio-list label:has(input:checked) { border-color: var(--ink); background: #f3f4fa; }
.radio-list b { display: block; font-size: 13.5px; }
.radio-list span { font-size: 12px; color: var(--muted); }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(460px, 100vw); background: var(--raised); z-index: 70; box-shadow: -20px 0 60px -20px rgba(35,38,74,.4); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.drawer.open { transform: none; }
.drawer-scrim { position: fixed; inset: 0; z-index: 65; background: rgba(35,38,74,.22); }
.drawer-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 16px; line-height: 1.5; }
.drawer-body { padding: 16px 22px 24px; overflow-y: auto; }

.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(380px, .9fr); }
.login-art { background: var(--ink); color: #d9dcf0; padding: 40px 48px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.login-art h1 { font-family: var(--serif); font-size: clamp(30px, 3.4vw, 44px); line-height: 1.35; color: #fff; margin-top: auto; max-width: 13em; font-weight: 700; }
.login-art p { margin-top: 14px; color: #a9aed3; max-width: 32em; }
.login-art .strip { margin-top: 44px; position: relative; height: 70px; }
.login-art .strip i { position: absolute; bottom: 24px; width: 6px; border-radius: 3px; background: #4b5088; }
.login-art .strip i.lit { background: var(--lamp); box-shadow: 0 0 14px rgba(240,180,41,.5); }
.login-art .strip .axis { position: absolute; left: 0; right: 0; bottom: 18px; height: 1px; background: #4b5088; }

.login-art .moon { position: absolute; right: -90px; top: -90px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle at 40% 60%, rgba(240,180,41,.35), rgba(240,180,41,0) 65%); }
.login-form { display: grid; place-items: center; padding: 40px 28px; background: var(--canvas); }
.login-form form { width: min(360px, 100%); display: grid; gap: 16px; }
.login-form h2 { font-family: var(--serif); font-size: 26px; color: var(--ink); }
.login-form .btn { height: 44px; justify-content: center; font-size: 14px; }
.login-form .err { color: var(--rose); font-size: 12.5px; }
.login-form .hint { font-size: 12px; color: var(--muted); }

@media (max-width: 860px) {

  .login-art { padding: 28px 24px 24px; min-height: 300px; }

function bindGraph() {
  const svg = $("svg.graph"); if (!svg) return;
  let drag = null;
  const pt = ev => { const m = svg.getScreenCTM?.(); if (!m) return null; const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(m.inverse()); };
  const redraw = id => {
    const p = state.gPos[id]; const g = $(`[data-gn="${id}"]`, svg); g.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    $$(`.ge[data-a="${id}"], .ge[data-b="${id}"]`).forEach(ge => { const e = { a: ge.dataset.a, b: ge.dataset.b }, q = edgePath(e); $("path", ge).setAttribute("d", q.d); const t = $("text", ge); t.setAttribute("x", q.lx.toFixed(1)); t.setAttribute("y", q.ly.toFixed(1)); });
  };
  svg.addEventListener("pointerdown", ev => { const g = ev.target.closest("[data-gn]"); if (!g) return; const p = pt(ev); if (!p) return; drag = { id: g.dataset.gn, sx: p.x, sy: p.y, ox: state.gPos[g.dataset.gn].x, oy: state.gPos[g.dataset.gn].y, moved: false }; g.setPointerCapture?.(ev.pointerId); svg.classList.add("dragging"); });
  svg.addEventListener("pointermove", ev => { if (!drag) return; const p = pt(ev); if (!p) return; const dx = p.x - drag.sx, dy = p.y - drag.sy; if (Math.hypot(dx, dy) > 3) drag.moved = true; if (!drag.moved) return; state.gPos[drag.id] = { x: Math.max(30, Math.min(970, drag.ox + dx)), y: Math.max(30, Math.min(570, drag.oy + dy)) }; redraw(drag.id); });
  const end = () => { if (!drag) return; const d = drag; drag = null; svg.classList.remove("dragging"); if (!d.moved) pickNode(d.id); };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", () => { drag = null; svg.classList.remove("dragging"); });
  svg.addEventListener("keydown", ev => { const g = ev.target.closest("[data-gn]"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); pickNode(g.dataset.gn); } });
}
function pickNode(id) { state.gSel = id || null; state.gMem = null; go({ keepScroll: true }); if (id) $(`[data-gn="${id}"]`)?.focus({ preventScroll: true }); }

const val = k => (k in state.draft ? state.draft[k] : VALUES[k]);
function fmt(k, v) {

  if (f.t === "list") return v.length ? v.join("、") : "（空）";
  if (f.t === "hour") return String(v).padStart(2, "0") + ":00";
  if (f.t === "select") return (f.opts.find(o => o[0] === v) || [v, v])[1];
  if (f.t === "num") { const x = v / (f.f || 1); return (f.pre || "") + (+x.toFixed(4)).toLocaleString("zh-CN") + (f.unit ? " " + f.unit : ""); }
  return String(v);
}
const nameOf = k => FIELDS[k]?.n || CAPS.flatMap(g => g[2]).find(c => c.k === k)?.n || k;
function ctl(k) {
  const f = FIELDS[k] || { t: "bool" }, v = val(k), lock = f.lock ? "disabled" : "";

    return `<div class="listed">${f.modeKey ? `<div class="seg list-mode" role="radiogroup" aria-label="${esc(FIELDS[f.modeKey].n)}">${FIELDS[f.modeKey].opts.map(([o, l]) => `<button type="button" role="radio" aria-pressed="${val(f.modeKey) === o}" aria-checked="${val(f.modeKey) === o}" data-list-mode="${f.modeKey}" data-v="${o}">${l}</button>`).join("")}</div>` : ""}
    ${deny && f.warnDeny ? `<p class="alert" style="margin:10px 0 4px">${ic("warn")}<span>${esc(f.warnDeny)}</span></p>` : ""}<ul class="${deny ? "deny" : ""}">${v.length ? v.map((h, i) => `<li><span>${esc(h)}</span><button type="button" class="icon-btn" data-list-rm="${k}" data-i="${i}" aria-label="移除 ${esc(h)}">${ic("close")}</button></li>`).join("") : `<li class="none ${deny ? "ok" : ""}">${esc(deny ? f.emptyDeny || "名单是空的。" : f.emptyAllow || "名单是空的。")}</li>`}</ul>
    <form class="list-add" data-list-add="${k}" novalidate><input class="input" aria-label="添加到${esc(f.n)}" placeholder="${esc(f.ph || "")}" ${v.length >= f.max ? "disabled" : ""}><button class="btn sm" ${v.length >= f.max ? "disabled" : ""}>添加</button><small class="num">${v.length} / ${f.max}</small></form><p class="list-err" role="alert" hidden></p></div>`; }
  if (f.t === "bool") return `<button class="switch" role="switch" aria-checked="${!!v}" data-k="${k}" aria-label="${esc(nameOf(k))}" ${lock}></button>`;
  if (f.t === "select") return `<select class="input" data-k="${k}">${f.opts.map(([o, l]) => `<option value="${o}" ${o === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  if (f.t === "hour") return `<select class="input hour" data-k="${k}" data-int>${H24.map(([h, l]) => `<option value="${h}" ${h === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  if (f.t === "num") return `<span class="unit ${f.pre ? "has-pre" : ""}">${f.pre ? `<i>${f.pre}</i>` : ""}<input class="input" data-k="${k}" data-num value="${+(v / (f.f || 1)).toFixed(4)}" inputmode="decimal" step="${f.step || 1}">${f.unit ? `<em>${f.unit}</em>` : ""}</span>`;

}
