   mode: owner 只由主人控制 / propose 她提议、主人批准 / self 她在范围内自行调整
   她的调整只是运行时覆盖：立即生效，不生成配置版本，主人的配置值始终是默认值与上限。 */
const AUTO = {
  proactive: { mode: "self", toggle: true, ranges: { proactive_daily_limit: [1, 3], proactive_interval_seconds: [7200, 21600] } },
  expression: { mode: "self", toggle: true, ranges: { expression_cooldown_minutes: [15, 60] } },
  wake: { mode: "propose", toggle: true, ranges: { wake_max_daily_runs: [1, 5] } },
  memesem: { mode: "propose", toggle: false, ranges: {} },
};
const NO_AUTO = {
  social: "会改动别人看得到的 QQ 资料，只能由你控制。", executive: "执行任务只能由你控制。", files: "涉及你的私人文件，只能由你控制。",
  xhs: "读取授权只能由你授予。", web: "允许读取的网站名单只能由你设置。", media: "媒体会话只能由你发起。", memory: "记忆的开关影响遗忘与证据链，只能由你控制。",
};
const AGENT_OVR = { proactive_daily_limit: 2, expression_cooldown_minutes: 20 };
const AUTO_LOG = [
  { id: "adj_31", cap: "wake", at: "今天 20:05", ch: ["wake_max_daily_runs", 3, 4], why: "你分享的 2 篇骑行文章还没读完，想今天多醒一次", st: "PROPOSED" },
  { id: "adj_30", cap: "proactive", at: "10月23日 09:12", ch: ["proactive_daily_limit", 3, 2], why: "你周一到周三都说工作很忙，晚上回复变慢了", st: "APPLIED" },
  { id: "adj_29", cap: "expression", at: "10月22日 21:40", ch: ["expression_cooldown_minutes", 30, 20], why: "最近 7 天表情回应 5 次里 2 次被你夸，没有被嫌弃", st: "APPLIED" },
  { id: "adj_27", cap: "proactive", at: "10月20日 22:30", ch: ["__pause", false, true], why: "你说今晚要早睡", st: "EXPIRED", note: "已在次日 08:00 自动恢复" },
];
Object.assign(ST, { APPLIED: ["已生效", "ok"], REJECTED: ["已拒绝", "off"], REVERTED: ["已撤销", "off"], EXPIRED: ["已结束", "off"] });
const MODE_NAME = { owner: "只由我控制", propose: "她提议，我批准", self: "她在范围内自己调整" };
const eff = k => (state.autoOn && k in AGENT_OVR ? AGENT_OVR[k] : val(k));
const allCaps = () => CAPS.flatMap(g => g[2]);
const capById = id => allCaps().find(c => c.id === id);
const autoOf = id => AUTO[id] || { mode: "owner", toggle: false, ranges: {} };
const proposals = () => AUTO_LOG.filter(l => l.st === "PROPOSED");

const needOk = x => typeof x === "function" ? !!x() : typeof x === "string" ? !!val(x) : !!x;
function capState(c) {
  if (c.lock) return "UNAVAILABLE";
  if (!val(c.k)) return "DISABLED";
  if ((c.need || []).some(([, x]) => !needOk(x))) return "BLOCKED";
  if (c.rt && CAP_RUNTIME[c.id]) return "PAUSED";
  return c.warn ? "ATTENTION" : c.st;
}
function meter(c) {
  let used, cap, label = "今日", money = true, pre = "$";
  if (c.use) [used, cap] = [c.use[0], val(c.use[1])];
  else if (c.cny) { [used, cap] = [c.cny[0], val(c.cny[1])]; label = "最近一次"; pre = "¥"; }
  else if (c.count) { [used, cap] = [c.count[0], eff(c.count[1])]; money = false; }
  else return `<div class="cap-meter"><span class="muted">这项能力不单独计费</span></div>`;
  const pct = cap > 0 ? Math.min(100, used / cap * 100) : 100, cls = pct >= 100 ? "full" : pct >= 75 ? "high" : "";
  const show = x => money ? pre + (x / 1e6).toFixed(2) : x + " " + c.count[2];
  return `<div class="cap-meter ${cls}"><span>${label} <b class="num">${show(used)}</b> / ${cap > 0 ? show(cap) : "未分配额度"}</span><div class="mbar"><i style="width:${pct}%"></i></div>${c.cny ? `<small>${c.cny[2]}任务上限</small>` : ""}</div>`;
}
const capMatch = c => {
  const q = state.capQ.trim();
  const pick = { all: () => true, on: c => !!val(c.k) && !c.lock, off: c => !val(c.k) || c.lock, warn: c => ["BLOCKED", "ATTENTION", "PAUSED"].includes(capState(c)), auto: c => autoOf(c.id).mode !== "owner" };
  return pick[state.capF](c) && (!q || (c.n + c.d + (c.p || []).map(nameOf).join("")).includes(q));
};

PAGES.caps = () => {
  const all = allCaps(), sel = capById(state.capSel) || all[0];
  state.capSel = sel.id;
  const searching = !!state.capQ.trim();
  const n = f => { const keep = state.capF; state.capF = f; const x = all.filter(capMatch).length; state.capF = keep; return x; };
  const index = CAPS.map(([gid, gn, list]) => {
    const shown = list.filter(capMatch); if (!shown.length) return "";
    const open = searching || !state.capCollapsed.has(gid);
    return `<div class="ci-group"><button class="ci-ghead" data-group-toggle="${gid}" aria-expanded="${open}">${ic("right", "i chev")}<span>${gn}</span><small>${list.filter(c => val(c.k) && !c.lock).length}/${list.length}</small></button>
      ${open ? shown.map(c => { const s = capState(c), a = autoOf(c.id).mode;
        return `<div class="ci-row ${c.id === sel.id ? "sel" : ""} ${s === "DISABLED" || s === "UNAVAILABLE" ? "off" : ""}">
          <button class="ci-name" data-cap-sel="${c.id}" ${c.id === sel.id ? 'aria-current="true"' : ""}><span class="dot ${(ST[s] || [, "off"])[1]}" title="${(ST[s] || [s])[0]}"></span><span class="nm">${esc(c.n)}</span>${a !== "owner" ? `<span class="auto-ic" title="${MODE_NAME[a]}">${ic("spark")}</span>` : ""}${proposals().some(p => p.cap === c.id) ? '<span class="pdot" title="有待批准的提议"></span>' : ""}</button>
          <button class="switch sm" role="switch" aria-checked="${!!val(c.k) && !c.lock}" data-k="${c.k}" aria-label="${esc(c.n)}总开关" ${c.lock ? "disabled" : ""}></button></div>`; }).join("") : ""}</div>`;
  }).join("");
  return head("能力与开关", "左边找能力，右边看它的状态、参数和交给她决定的范围。总开关和参数保存为新版本后生效；暂停和她的自主调整立即生效。") + autoBanner() +
    `<div class="caps2 ${state.capMobile ? "show-detail" : ""}">
      <aside class="cap-index" aria-label="能力列表">
        <label class="search">${ic("search")}<input class="input" id="cap-q" placeholder="搜索能力或参数" value="${esc(state.capQ)}"></label>
        <div class="ci-filter" role="group" aria-label="筛选">${[["all", "全部"], ["on", "已开启"], ["off", "未开启"], ["warn", "需留意"], ["auto", "交给她"]].map(([k, l]) => `<button data-cap-f="${k}" aria-pressed="${state.capF === k}">${l} <span class="num">${n(k)}</span></button>`).join("")}</div>
        <div class="ci-list">${index || `<div class="empty"><h3>没有符合条件的能力</h3><p>换个关键词，或选择“全部”。</p></div>`}</div>
      </aside>
      <section class="cap-detail" aria-label="${esc(sel.n)}详情">${capDetail(sel)}</section>
    </div>`;
};
PAGES.caps.after = () => { const s = $(".ci-row.sel"); if (s && !state.capMobile) s.scrollIntoView?.({ block: "nearest" }); };

function autoBanner() {
  const delegated = allCaps().filter(c => autoOf(c.id).mode !== "owner").length, p = proposals();
  return `<div class="auto-banner ${state.autoOn ? "" : "stopped"}"><span class="ab-ic">${ic("spark")}</span>
    <div><b>${state.autoOn ? "她的自主调整：开启" : "她的自主调整：已停止"}</b><span>${delegated} 项能力交给她决定，${Object.keys(AGENT_OVR).length} 个参数正由她调整${p.length ? `，<a href="#caps/${p[0].cap}">${p.length} 条提议等你批准</a>` : ""}。${state.autoOn ? "" : "她现在不能做新的调整，已有调整暂不生效。"}</span></div>
    <div class="ab-acts"><button class="btn sm" data-auto-master>${state.autoOn ? ic("pause") + "停止她的调整" : "恢复她的调整"}</button>${Object.keys(AGENT_OVR).length ? `<button class="btn sm quiet" data-auto-reset>全部还原为我的设置</button>` : ""}</div></div>`;
}

function capDetail(c) {
  const s = capState(c), a = autoOf(c.id);
  const needs = (c.need || []).map(([t, x]) => { const ok = needOk(x); return `<li class="${ok ? "ok" : "no"}">${ic(ok ? "check" : "close")}${esc(typeof t === "function" ? t() : t)}</li>`; }).join("");
  const limitKey = c.use ? c.use[1] : null;
  const params = (limitKey ? `${fieldRow(limitKey, `<p class="pf-hint">所有场景的额度和本月总额在 <a href="#config" data-goto-budget>配置 › 费用与预算</a> 里一起看。</p>`, "每日额度")}` : "") + (c.p || []).map(k => fieldRow(k, state.autoOn && k in AGENT_OVR ? `<p class="ovr">${ic("spark")}她调整为 <b>${esc(fmt(k, AGENT_OVR[k]))}</b>，你的设置是 ${esc(fmt(k, val(k)))}<button class="btn sm quiet" data-ovr-clear="${k}">还原</button></p>` : "")).join("");
  const logs = AUTO_LOG.filter(l => l.cap === c.id);
  const ownerLogs = VERSIONS.flatMap(v => v.ch.filter(([k]) => k === c.k || (c.p || []).includes(k)).map(ch => ({ at: v.at, ch, v: v.v }))).reverse();
  const running = c.rt ? (CAP_RUNTIME[c.id] ? "已暂停" : "运行中") : val(c.k) && !c.lock ? "运行中" : "未运行";
  return `<button class="btn sm quiet cd-back" data-cap-back>${ic("left")}全部能力</button>
    <header class="cd-head"><div><h2>${esc(c.n)}</h2><p>${esc(c.d)}</p></div>
      <div class="cd-switch"><span>${tag(s)}</span><label><span>总开关</span><button class="switch" role="switch" aria-checked="${!!val(c.k) && !c.lock}" data-k="${c.k}" aria-label="${esc(c.n)}总开关" ${c.lock ? "disabled" : ""}></button></label><code>${c.k}</code></div></header>
    ${proposals().filter(l => l.cap === c.id).map(l => `<div class="prop-box"><span class="who it">她</span><div><b>她想把${esc(nameOf(l.ch[0]))}从 ${esc(fmt(l.ch[0], l.ch[1]))} 改为 ${esc(fmt(l.ch[0], l.ch[2]))}</b><p>理由：${esc(l.why)}</p><small>${l.at}提出</small></div><span class="pb-acts"><button class="btn sm primary" data-log-approve="${l.id}">${ic("check")}批准</button><button class="btn sm danger" data-log-reject="${l.id}">${ic("close")}拒绝</button></span></div>`).join("")}
    ${c.lock ? `<p class="lockline">${ic("lock")}${esc(c.lock)}</p>` : ""}${c.warn && val(c.k) ? `<p class="warnline">${ic("warn")}${esc(c.warn)}</p>` : ""}
    <div class="cd-stats">
      <div><span>用量</span>${meter(c)}${c.use ? `<button class="btn sm quiet lim" data-goto-limit="${c.use[1]}">${ic("edit")}调整每日额度</button>` : c.cny ? `<a class="btn sm quiet lim" href="#config" data-goto-budget>${ic("edit")}在费用与预算里调整</a>` : ""}</div>
      <div><span>运行状态</span><b>${running}</b>${c.rt && val(c.k) ? `<button class="btn sm" data-rt="${c.id}">${CAP_RUNTIME[c.id] ? "恢复" : ic("pause") + "暂停"}</button><small>立即生效</small>` : `<small>${c.rt ? "" : "这项能力没有单独的暂停"}</small>`}</div>
      <div><span>由谁决定</span><b>${NO_AUTO[c.id] || c.lock ? "只由我控制" : MODE_NAME[a.mode]}</b><small>${a.mode === "self" ? `${Object.keys(a.ranges).length} 个参数可调${a.toggle ? "，可暂停" : ""}` : a.mode === "propose" ? "调整需要你批准" : "她不能改动"}</small></div>
    </div>
    ${needs ? `<section class="cd-sec"><h3>启用条件</h3><ul class="needs">${needs}</ul></section>` : ""}
    <section class="cd-sec"><h3>参数<span>${c.p || limitKey ? (c.p || []).length + (limitKey ? 1 : 0) + " 项，保存为新版本后生效" : ""}</span></h3>${c.p || limitKey ? `<div class="pf-list">${params}</div>` : `<p class="note">这项能力没有可调的参数，只有总开关。</p>`}</section>
    ${autoSection(c)}
    <section class="cd-sec"><h3>变更记录</h3>${logs.length || ownerLogs.length ? `<ul class="clog">
      ${logs.map(l => `<li class="${l.st === "PROPOSED" ? "prop" : ""}"><span class="who it">她</span><div><b>${l.ch[0] === "__pause" ? "暂停了这项能力" : `${esc(nameOf(l.ch[0]))}：${esc(fmt(l.ch[0], l.ch[1]))} 改为 ${esc(fmt(l.ch[0], l.ch[2]))}`}</b><p>理由：${esc(l.why)}</p><small>${l.at}${l.note ? "，" + l.note : ""}</small></div>
        <div class="clog-r">${tag(l.st)}${l.st === "PROPOSED" ? `<span><button class="btn sm primary" data-log-approve="${l.id}">批准</button><button class="btn sm danger" data-log-reject="${l.id}">拒绝</button></span>` : l.st === "APPLIED" ? `<button class="btn sm quiet" data-log-revert="${l.id}">撤销</button>` : ""}</div></li>`).join("")}
      ${ownerLogs.map(o => `<li><span class="who me">你</span><div><b>${esc(nameOf(o.ch[0]))}：${esc(fmt(o.ch[0], o.ch[1]))} 改为 ${esc(fmt(o.ch[0], o.ch[2]))}</b><small>${o.at}，配置 v${o.v}</small></div><div class="clog-r"></div></li>`).join("")}</ul>` : `<p class="note">还没有改动记录。</p>`}</section>`;
}

function autoSection(c) {
  const why = c.lock ? "这项能力本阶段不开放。" : NO_AUTO[c.id];
  if (why) return `<section class="cd-sec"><h3>交给她决定</h3><p class="lockline">${ic("lock")}${esc(why)}</p></section>`;
  const a = autoOf(c.id), nums = (c.p || []).filter(k => FIELDS[k]?.t === "num" || FIELDS[k]?.t === "hour"), bools = (c.p || []).filter(k => FIELDS[k]?.t === "bool" && !FIELDS[k].lock);
  const rangeRow = k => {
    const f = FIELDS[k], on = k in a.ranges, [lo, hi] = a.ranges[k] || [val(k), val(k)], d = x => +(x / (f.f || 1)).toFixed(3);
    return `<li class="${on ? "on" : ""}"><label class="ck"><input type="checkbox" data-delegate="${k}" ${on ? "checked" : ""}><span>${esc(f.n)}</span></label>
      ${on ? `<span class="rng"><input class="input" data-range="${k}" data-end="0" value="${d(lo)}" inputmode="decimal" aria-label="${esc(f.n)}最小值"><span>到</span><input class="input" data-range="${k}" data-end="1" value="${d(hi)}" inputmode="decimal" aria-label="${esc(f.n)}最大值"><em>${f.unit || ""}</em></span>` : `<span class="muted">由你决定，当前 ${esc(fmt(k, val(k)))}</span>`}</li>`;
  };
  const boolRow = k => `<li class="${k in a.ranges ? "on" : ""}"><label class="ck"><input type="checkbox" data-delegate="${k}" ${k in a.ranges ? "checked" : ""}><span>${esc(FIELDS[k].n)}</span></label><span class="muted">${k in a.ranges ? "她可以替你开或关" : "由你决定，当前" + (val(k) ? "开" : "关")}</span></li>`;
  return `<section class="cd-sec auto-sec"><h3>交给她决定<span class="chip">新机制提案</span></h3>
    <div class="mode-pick" role="radiogroup" aria-label="由谁决定">${["owner", "propose", "self"].map(m => `<button role="radio" aria-checked="${a.mode === m}" data-auto-mode="${m}"><b>${MODE_NAME[m]}</b><span>${{ owner: "她不能改这项能力的任何设置。", propose: "她可以提出调整和理由，你批准后才生效。", self: "在你划定的范围内，她可以直接调整，事后可撤销。" }[m]}</span></button>`).join("")}</div>
    ${a.mode !== "owner" ? `
      <label class="ck big"><input type="checkbox" data-auto-toggle ${a.toggle ? "checked" : ""}><span><b>允许她暂停和恢复这项能力</b><small>暂停最长到第二天 08:00，到时自动恢复。她不能打开你关掉的能力。</small></span></label>
      ${nums.length || bools.length ? `<p class="sub2">她可以调整的参数</p><ul class="ranges">${nums.map(rangeRow).join("")}${bools.map(boolRow).join("")}</ul>` : ""}
      <p class="note">她的调整只改变运行状态，立即生效，不生成配置版本。你的配置值始终是默认值，超出范围的调整会被拒绝。每次调整都会记下理由，你可以在下方撤销。</p>` : ""}
  </section>`;
}

PAGES.config_after = () => spyToc();
const CFG_SECTIONS = [["version", "版本"], ["model", "模型与计价"], ["schedule", "作息时间"], ["budget", "费用与预算"], ["secrets", "密钥与令牌"], ["runtime", "运行与控制台"]];

  }

</nav>
    <div class="cfg-main">${secVersion()}${secModel()}${secSchedule()}${secBudget()}${secSecrets()}${secRuntime()}</div></div>`;
};
const SEC_KEYS = {
  model: ["provider", "model_url", "model_name", "max_output_tokens", "context_soft_tokens", "max_recent_messages", "input_rate", "cached_input_rate", "output_rate"],
  schedule: ["timezone", "quiet_start", "quiet_end", "diary_generate_hour", "consolidation_local_hour"],
  budget: ["monthly_limit_micro_usd", ...Object.keys(TODAY_USD)],
  runtime: ["mode", "lease_seconds", "console.public_origin", "console.session_seconds", "console.max_sessions"],
};
const CFG_DIRTY = id => (SEC_KEYS[id] || []).some(k => k in state.draft);
function cfgHead() {

    `<div class="toolbar"><label class="search" style="max-width:420px">${ic("search")}<input class="input" id="cfg-q" placeholder="搜索全部设置，包括能力参数" value="${esc(state.cfgQ)}"></label></div>`;
}
function secVersion() {

  if (VSTATE.pending) nodes.push({ v: VSTATE.pending.v, at: VSTATE.pending.at, by: "主人控制台", ch: VSTATE.pending.ch, kind: "pending" });
  const label = { active: "生效中", old: "历史", pending: "待生效" };

    <ol class="vchain">${nodes.map(n => `<li class="${n.kind}"><button data-ver="${n.v}"><b class="num">v${n.v}</b><span>${label[n.kind]}</span><small>${n.at}，${n.ch.length} 项修改</small></button></li>`).join("")}
      ${!VSTATE.pending ? `<li class="next"><span><b class="num">v${VSTATE.active + 1}</b><span>${Object.keys(state.draft).length ? Object.keys(state.draft).length + " 项修改未保存" : "暂无修改"}</span></span></li>` : ""}</ol>
    ${VSTATE.pending ? `<div class="apply"><div><h3>v${VSTATE.pending.v} 已保存，还没有生效</h3><p class="note">按下面的顺序在服务器上操作。完成重启后，这里会显示为生效中。</p>
      <ol class="steps"><li>停止聊天、日记、内容和生活进程</li><li>做一次加密备份</li><li>如果在 QQ 私人窗口期内，先完成窗口交接</li><li>重启 API 和各个进程</li></ol></div>

  </div></section>`;

function secModel() {
  const inTok = val("context_soft_tokens"), outTok = val("max_output_tokens");
  const microUsd = (inTok * val("input_rate") + outTok * val("output_rate")) / 1e6, fx = val("cloud_budget.usd_to_cny_micro") / 1e6;

}
function secSchedule() {
  const qs = val("quiet_start"), qe = val("quiet_end"), dh = val("diary_generate_hour"), ch = val("consolidation_local_hour");

    <div class="clock" role="img" aria-label="免打扰 ${fmt("quiet_start", qs)} 到 ${fmt("quiet_end", qe)}，日记 ${fmt("diary_generate_hour", dh)}，夜间整理 ${fmt("consolidation_local_hour", ch)}">
      ${bands.map(([a, z]) => `<div class="cband" style="left:${x(a)};width:${x(z - a)}"></div>`).join("")}
      <div class="cnow" style="left:${NOW_MIN / 1440 * 100}%"></div>

    </div>
    <p class="note" style="margin:6px 0 14px">斜纹是免打扰时段：不发主动消息，回复照常。${pro ? `其余时间主动私聊每天最多 ${val("proactive_daily_limit")} 次，间隔至少 ${val("proactive_interval_seconds") / 60} 分钟。` : "主动私聊目前已关闭。"}${val("consolidation_enabled") ? "" : "夜间整理未开启，标记为灰色。"}</p>
    <div class="pf-list">${SEC_KEYS.schedule.map(k => fieldRow(k)).join("")}</div>
  </div></section>`;
}
function secBudget() {
  const cb = state.cloud, used = D.budget.settled + D.budget.reserved + D.budget.unknown;
  const cpct = Math.min(100, used / cb.daily * 100), mlim = val("monthly_limit_micro_usd"), mpct = Math.min(100, MONTH_USD / mlim * 100);
  const cdirty = cb.daily !== VALUES["cloud_budget.daily_micro_cny"] || cb.video !== VALUES["cloud_budget.video_per_item_micro_cny"] || cb.asr !== VALUES["cloud_budget.asr_per_item_micro_cny"] || cb.fx !== VALUES["cloud_budget.usd_to_cny_micro"];
  const cin = (id, v, pre, unit) => `<span class="unit ${pre ? "has-pre" : ""}">${pre ? `<i>${pre}</i>` : ""}<input class="input" data-cloud="${id}" value="${+(v / 1e6).toFixed(2)}" inputmode="decimal">${unit ? `<em>${unit}</em>` : ""}</span>`;
  return `<section class="sheet cfg-sec" id="cfg-budget"><div class="sheet-head"><h2>费用与预算</h2></div><div class="sheet-body">
    <div class="budget-block">
      <div class="bb-head"><div><h3>云端人民币预算</h3><p class="note">保存后立即约束之后的云调用，不需要新版本和重启。不会重置已有费用和预留。</p></div><span class="chip">立即生效</span></div>
      <div class="bigline"><b class="num">¥${(used / 1e6).toFixed(2)}</b><span>今天已占用，限额 ¥${(cb.daily / 1e6).toFixed(2)}</span></div>
      <div class="mbar big ${cpct >= 100 ? "full" : cpct >= 75 ? "high" : ""}"><i style="width:${cpct}%"></i></div>
      <div class="cloud-grid">
        <label class="field"><span>每日限额</span>${cin("daily", cb.daily, "¥")}</label>
        <label class="field"><span>单个视频任务</span>${cin("video", cb.video, "¥")}</label>
        <label class="field"><span>单个语音任务</span>${cin("asr", cb.asr, "¥")}</label>
        <label class="field"><span>美元汇率</span>${cin("fx", cb.fx, "", "CNY")}<small>运营估算，剩余 23 天有效</small></label>
      </div>
      <div class="bb-acts"><button class="btn sm primary" data-cloud-save ${cdirty ? "" : "disabled"}>更新云端预算</button>${cdirty ? `<button class="btn sm quiet" data-cloud-reset>还原</button>` : ""}</div>
    </div>
    <div class="budget-block">
      <div class="bb-head"><div><h3>模型账本（美元）</h3><p class="note">按场景分配每日额度，0 表示这个场景不能花钱。属于配置，保存为新版本后生效。</p></div><span class="chip">新版本生效</span></div>
      <div class="month"><span>本月已用 <b class="num">$${(MONTH_USD / 1e6).toFixed(2)}</b></span>${ctl("monthly_limit_micro_usd")}<div class="mbar"><i style="width:${mpct}%"></i></div></div>
      <table class="t scen"><thead><tr><th>场景</th><th>今日用量</th><th class="r">每日额度</th></tr></thead><tbody>
      ${Object.keys(TODAY_USD).map(k => { const cap = val(k), u = TODAY_USD[k], p = cap > 0 ? Math.min(100, u / cap * 100) : 0;
        return `<tr class="${k in state.draft ? "changed" : ""}"><td><b style="font-weight:600">${FIELDS[k].n}</b><code class="key">${k}</code></td><td>${cap > 0 ? `<div class="mini"><div class="mbar ${p >= 100 ? "full" : p >= 75 ? "high" : ""}"><i style="width:${p}%"></i></div><span class="num">$${(u / 1e6).toFixed(3)}</span></div>` : `<span class="muted">不能花费</span>`}</td><td class="r">${ctl(k)}</td></tr>`; }).join("")}
      </tbody></table>
    </div>
  </div></section>`;
}
function secSecrets() {
  return `<section class="sheet cfg-sec" id="cfg-secrets"><div class="sheet-head"><h2>密钥与令牌</h2><span class="note">只能写入，任何地方都不会显示原值</span></div><div class="sheet-body"><ul class="secrets">
    ${SECRETS.map(([env, n, set, when, note, editable]) => `<li><span class="lockic">${ic("lock")}</span><div><b>${n}</b><code>${env}</code><p class="note">${note}</p></div>
      <div class="sec-r"><span class="tag ${set ? "ok" : "off"}">${set ? "已设置" : "未设置"}</span><small>${when}</small>${editable ? `<button class="btn sm" data-secret="${env}">替换</button>` : `<small class="muted">在部署环境更换</small>`}</div></li>`).join("")}
  </ul></div></section>`;
}
function secRuntime() {
  return `<section class="sheet cfg-sec" id="cfg-runtime"><div class="sheet-head"><h2>运行与控制台</h2></div><div class="sheet-body"><div class="pf-list">${SEC_KEYS.runtime.map(k => fieldRow(k)).join("")}</div></div></section>`;
}

/* 底部保存栏：能力页和配置页共用一份草稿 */
function saveBar() {
  const n = Object.keys(state.draft).length;
  if (!n || !["caps", "config"].includes(state.route)) return "";
  const next = VSTATE.pending ? VSTATE.pending.v : VSTATE.active + 1;
  return `<div class="savebar"><p><b class="num">${n}</b> 项修改未保存。${VSTATE.pending ? `会合并进待生效的 v${next}。` : `保存后成为 v${next}，重启后生效。`}</p><button class="btn quiet" data-draft-reset>放弃修改</button><button class="btn quiet" data-draft-review>查看修改</button><button class="btn primary" data-draft-save>保存为 v${next}</button></div>`;
}

</script>
<script>
"use strict";
/* ================= 交互 ================= */
function mount() {
  $("#logout").innerHTML = ic("logout"); $("#menu").innerHTML = ic("menu"); $("#refresh").innerHTML = ic("refresh"); $("#search-ic").innerHTML = ic("search");
  // 登录页上的装饰时间带：今天已有的活动亮灯
  $("#login-strip").innerHTML = '<span class="axis"></span>' + D.day.map((e, i) => `<i class="${e.m <= NOW_MIN && i % 3 === 0 ? "lit" : ""}" style="left:${e.m / 1440 * 100}%;height:${10 + (i * 7) % 26}px"></i>`).join("") +
    [0, 6, 12, 18, 24].map(h => `<span style="left:${h / 24 * 100}%">${String(h).padStart(2, "0")}:00</span>`).join("");
}
function enterApp() { $("#login").hidden = true; $("#app").hidden = false; go(); }
function leaveApp() { $("#app").hidden = true; $("#login").hidden = false; $("#pw").value = ""; closeDrawer(); $("#pw").focus(); }

$("#login-form").addEventListener("submit", e => {
  e.preventDefault();
  const err = $("#login-err");
  if (!$("#pw").value.trim()) { err.textContent = "请输入控制台密码。"; err.hidden = false; $("#pw").focus(); return; }
  err.hidden = true; enterApp();
});
$("#logout").addEventListener("click", leaveApp);
$("#menu").addEventListener("click", () => $("#side").classList.toggle("open"));
$("#refresh").addEventListener("click", () => { go(); toast("已刷新"); });
window.addEventListener("hashchange", () => go({ keepScroll: true }));
function spyToc() {
  if (state.route !== "config") return;
  const secs = $$(".cfg-sec"); if (!secs.length) return;
  let cur = secs[0];
  const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
  if (atEnd) cur = secs[secs.length - 1]; else for (const sec of secs) if (sec.getBoundingClientRect().top < 160) cur = sec;
  $$(".cfg-toc a").forEach(a => a.toggleAttribute("aria-current", a.dataset.toc === cur.id));
}
window.addEventListener("scroll", () => { $("#top").classList.toggle("scrolled", scrollY > 4); spyToc(); }, { passive: true });
$("#drawer-scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && !$("#app").hidden) { e.preventDefault(); openPalette(); }
  if (e.key === "Escape" && $("#drawer").classList.contains("open")) closeDrawer();
});

/* 时间带提示 */
const tip = $("#tip");
function showTip(t) {
  const r = t.getBoundingClientRect();
  tip.innerHTML = t.dataset.tip.split("\n").map(l => { const [time, title, sub] = l.split("|"); return `<div class="tip-line"><b>${esc(time)} ${esc(title)}</b><span>${esc(sub)}</span></div>`; }).join(""); tip.hidden = false;
  const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px"; tip.style.top = (r.top - tip.offsetHeight - 8) + "px";
}
document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); t ? showTip(t) : (tip.hidden = true); });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); t ? showTip(t) : (tip.hidden = true); });

/* 统一的点击委托 */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, tr[data-content]"); if (!t) return;
  const ds = t.dataset;
  if ("close" in ds) { $("#dlg").close("cancel"); return; }
  if ("drawerClose" in ds) { closeDrawer(); return; }
  const handled = capClick(t, ds); if (handled) { if (handled === "prevent") e.preventDefault(); return; }
  if (ds.actKind) { state.actKind = ds.actKind; go(); return; }
  if (t.classList.contains("tl-item")) { t.setAttribute("aria-expanded", t.getAttribute("aria-expanded") !== "true"); return; }
  if (ds.memTab) { state.memTab = ds.memTab; go(); return; }
  if (ds.memDo) { memoryAction(t.closest("[data-mem]").dataset.mem, ds.memDo); return; }
  if (ds.reconcile) { reconcile(ds.reconcile); return; }
  if ("mode" in ds) { modeDialog(); return; }
  if (ds.day) { state.diaryDay = +ds.day; go(); return; }
  if (ds.diary) { diaryAction(ds.diary); return; }
  if (ds.goal) { const g = D.goals.find(g => g.st === "PROPOSED"); if (g) { g.st = ds.goal === "accept" ? "ACTIVE" : "CANCELLED"; if (ds.goal === "accept") g.d = "已接受，承诺期限 11月7日"; } go(); toast(ds.goal === "accept" ? "已接受目标" : "已取消目标"); return; }
  if (ds.content) { contentDetail(+ds.content); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "mem-q") { state.memQ = e.target.value; const pos = e.target.selectionStart; go(); const q = $("#mem-q"); q.focus(); q.setSelectionRange(pos, pos); }
});
/* ================= 能力与配置的交互 ================= */
function capClick(t, ds) {
  const rerender = () => go({ keepScroll: true });
  if (ds.capF) { state.capF = ds.capF; rerender(); return true; }
  if (ds.groupToggle) { const g = ds.groupToggle; state.capCollapsed.has(g) ? state.capCollapsed.delete(g) : state.capCollapsed.add(g); rerender(); return true; }
  if (ds.capSel) { state.capSel = ds.capSel; state.capMobile = true; history.replaceState(null, "", "#caps/" + ds.capSel); rerender(); if (innerWidth <= 860) window.scrollTo(0, 0); return true; }
  if ("capBack" in ds) { state.capMobile = false; rerender(); return true; }
  if (ds.play) { playVoice(ds.play); return true; }
  if (ds.gotoLimit) { const el = document.getElementById("pf-" + ds.gotoLimit.replace(/[^a-z0-9]/gi, "-")); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); const i = $("input", el); i && i.focus({ preventScroll: true }); setTimeout(() => el.classList.remove("flash"), 1400); } return true; }
  if ("gotoBudget" in ds) { location.hash = "#config"; setTimeout(() => document.getElementById("cfg-budget")?.scrollIntoView({ block: "start" }), 30); return "prevent"; }
  if (ds.autoMode) {
    const id = state.capSel; AUTO[id] = { ...autoOf(id), mode: ds.autoMode };
    if (ds.autoMode === "owner") for (const k of capById(id).p || []) delete AGENT_OVR[k];
    rerender(); toast(`${capById(id).n}：${MODE_NAME[ds.autoMode]}`); return true;
  }
  if (ds.logApprove || ds.logReject || ds.logRevert) {
    const l = AUTO_LOG.find(x => x.id === (ds.logApprove || ds.logReject || ds.logRevert)); const [k, , b] = l.ch;
    if (ds.logApprove) { l.st = "APPLIED"; AGENT_OVR[k] = b; toast("已批准，立即生效"); }
    else if (ds.logReject) { l.st = "REJECTED"; toast("已拒绝这条提议"); }
    else { l.st = "REVERTED"; delete AGENT_OVR[k]; toast("已撤销，恢复为你的设置"); }
    rerender(); return true;
  }
  if (ds.ovrClear) { delete AGENT_OVR[ds.ovrClear]; const l = AUTO_LOG.find(x => x.st === "APPLIED" && x.ch[0] === ds.ovrClear); if (l) l.st = "REVERTED"; rerender(); toast("已还原为你的设置"); return true; }
  if ("autoMaster" in ds) { state.autoOn = !state.autoOn; rerender(); toast(state.autoOn ? "已恢复她的自主调整" : "已停止她的自主调整"); return true; }
  if ("autoReset" in ds) {
    const d = dialog("全部还原为你的设置？", `<p>她现在调整过的 ${Object.keys(AGENT_OVR).length} 个参数会恢复为你的配置值，授权范围保持不变。</p><ul class="consequence">${Object.entries(AGENT_OVR).map(([k, v]) => `<li>${esc(nameOf(k))}：${esc(fmt(k, v))} 改回 ${esc(fmt(k, val(k)))}</li>`).join("")}</ul>`, `<button class="btn primary" value="ok">全部还原</button>`);
    d.addEventListener("close", () => { if (d.returnValue !== "ok") return; for (const k in AGENT_OVR) { delete AGENT_OVR[k]; } AUTO_LOG.forEach(l => { if (l.st === "APPLIED") l.st = "REVERTED"; }); rerender(); toast("已全部还原为你的设置"); }, { once: true });
    return true;
  }
  if (ds.rt) {
    CAP_RUNTIME[ds.rt] = !CAP_RUNTIME[ds.rt]; state.paused = Object.values(CAP_RUNTIME).every(Boolean);
    rerender(); toast(nameOfCap(ds.rt) + (CAP_RUNTIME[ds.rt] ? "已暂停，立即生效" : "已恢复，立即生效")); return true;
  }
  if (t.matches(".switch[data-k]")) { setDraft(ds.k, !(t.getAttribute("aria-checked") === "true")); return true; }
  if (ds.jump) { const el = document.getElementById(ds.jump); if (el) { el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); } return "prevent"; }
  if (ds.ver) { versionDrawer(+ds.ver); return true; }
  if ("withdraw" in ds) {
    const d = dialog(`撤回 v${VSTATE.pending.v}？`, `<p>待生效版本会被丢弃，当前生效的 v${VSTATE.active} 不受影响。这些修改不会回到草稿里。</p>`, `<button class="btn danger solid" value="ok">撤回 v${VSTATE.pending.v}</button>`);
    d.addEventListener("close", () => { if (d.returnValue !== "ok") return; const v = VSTATE.pending.v; for (const [k, a] of VSTATE.pending.ch) VALUES[k] = a; VSTATE.pending = null; go({ keepScroll: true }); toast(`已撤回 v${v}`); }, { once: true });
    return true;
  }
  if ("cloudSave" in ds) {
    const cb = state.cloud;
    const d = dialog("更新云端预算", `<p>保存后立即约束之后的云调用。已经开始的任务继续使用它们开始时的上限和汇率。</p>
      <ul class="consequence"><li>每日限额 ${yuan(VALUES["cloud_budget.daily_micro_cny"])} 改为 ${yuan(cb.daily)}</li><li>单个视频任务 ${yuan(VALUES["cloud_budget.video_per_item_micro_cny"])} 改为 ${yuan(cb.video)}</li><li>单个语音任务 ${yuan(VALUES["cloud_budget.asr_per_item_micro_cny"])} 改为 ${yuan(cb.asr)}</li><li>汇率 ${(VALUES["cloud_budget.usd_to_cny_micro"] / 1e6).toFixed(2)} 改为 ${(cb.fx / 1e6).toFixed(2)}</li></ul>`, `<button class="btn primary" value="ok">更新云端预算</button>`);
    d.addEventListener("close", () => { if (d.returnValue !== "ok") return; VALUES["cloud_budget.daily_micro_cny"] = cb.daily; VALUES["cloud_budget.video_per_item_micro_cny"] = cb.video; VALUES["cloud_budget.asr_per_item_micro_cny"] = cb.asr; VALUES["cloud_budget.usd_to_cny_micro"] = cb.fx; D.budget.limit = cb.daily; go({ keepScroll: true }); toast("已更新云端预算，立即生效"); }, { once: true });
    return true;
  }
  if ("cloudReset" in ds) { resetCloud(); go({ keepScroll: true }); return true; }
  if (ds.secret) {
    const d = dialog("替换模型密钥", `<p>新密钥会加密保存进下一个配置版本。界面上不会再显示它，留空不会清除原密钥。</p><label class="field"><span>新的模型密钥</span><input class="input" id="secret-new" type="password" autocomplete="new-password"></label>`, `<button class="btn primary" value="ok">替换密钥</button>`);
    d.addEventListener("close", () => { if (d.returnValue !== "ok" || !$("#secret-new").value.trim()) return; state.draft[ds.secret] = "••••"; go({ keepScroll: true }); toast("新密钥已加入待保存的修改"); }, { once: true });
    return true;
  }
  if ("draftReset" in ds) { state.draft = {}; go({ keepScroll: true }); toast("已放弃修改"); return true; }
  if ("draftReview" in ds) { reviewDrawer(); return true; }
  if ("draftSave" in ds) { saveDraft(); return true; }
  return false;
}
const nameOfCap = id => CAPS.flatMap(g => g[2]).find(c => c.id === id)?.n || id;
function resetCloud() { state.cloud = { daily: VALUES["cloud_budget.daily_micro_cny"], video: VALUES["cloud_budget.video_per_item_micro_cny"], asr: VALUES["cloud_budget.asr_per_item_micro_cny"], fx: VALUES["cloud_budget.usd_to_cny_micro"] }; }
const showVal = (k, v) => k.startsWith("COMPANION_") ? "新密钥" : fmt(k, v);
const diffList = ch => `<ul class="diff">${ch.map(([k, a, b]) => `<li><b>${esc(k.startsWith("COMPANION_") ? "模型密钥" : nameOf(k))}</b><span><s>${esc(k.startsWith("COMPANION_") ? "原密钥" : fmt(k, a))}</s> 改为 <ins>${esc(showVal(k, b))}</ins></span><code>${k}</code></li>`).join("")}</ul>`;
function draftChanges() { return Object.entries(state.draft).map(([k, v]) => [k, VALUES[k], v]); }
function versionDrawer(v) {
  const rec = VSTATE.pending && VSTATE.pending.v === v ? VSTATE.pending : VERSIONS.find(x => x.v === v);
  drawer(`v${v} 的修改`, `${rec.at}，来自${rec.by || "主人控制台"}`, diffList(rec.ch));
}
function reviewDrawer() {
  drawer("待保存的修改", `${Object.keys(state.draft).length} 项，保存前可以逐项撤销`, `<ul class="diff">${draftChanges().map(([k, a, b]) => `<li><b>${esc(k.startsWith("COMPANION_") ? "模型密钥" : nameOf(k))}</b><span><s>${esc(k.startsWith("COMPANION_") ? "原密钥" : fmt(k, a))}</s> 改为 <ins>${esc(showVal(k, b))}</ins></span><button class="btn sm quiet" data-undo="${k}">撤销</button></li>`).join("")}</ul>`);
}
function saveDraft() {
  const ch = draftChanges(), next = VSTATE.pending ? VSTATE.pending.v : VSTATE.active + 1;
  const d = dialog(`保存为 v${next}`, `<p>保存后成为待生效版本。运行中的请求继续使用 v${VSTATE.active}，按停止、备份、重启的顺序操作后才会生效。</p>${diffList(ch)}`, `<button class="btn primary" value="ok">保存 ${ch.length} 项修改</button>`);
  d.addEventListener("close", () => {
    if (d.returnValue !== "ok") return;
    if (!VSTATE.pending) VSTATE.pending = { v: next, at: "刚刚", ch: [] };
    for (const [k, a, b] of ch) { const old = VSTATE.pending.ch.find(c => c[0] === k); old ? (old[2] = b) : VSTATE.pending.ch.push([k, a, b]); if (!k.startsWith("COMPANION_")) VALUES[k] = b; }
    state.draft = {}; go({ keepScroll: true }); toast(`已保存为 v${next}，重启后生效`);
  }, { once: true });
}
document.addEventListener("click", e => {
  const u = e.target.closest("[data-undo]"); if (!u) return;
  delete state.draft[u.dataset.undo]; go({ keepScroll: true });
  Object.keys(state.draft).length ? reviewDrawer() : closeDrawer();
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-k]");
  if (c && !c.matches(".switch")) {
    const k = c.dataset.k, f = FIELDS[k] || {};
    let v = c.value;
    if ("num" in c.dataset) { const n = parseFloat(v); if (!Number.isFinite(n) || n < 0) { toast("请输入不小于 0 的数字"); go({ keepScroll: true }); return; } v = n * (f.f || 1); if (!(f.step && f.step < 1 && !f.f)) v = Math.round(v); }
    if ("int" in c.dataset) v = parseInt(v, 10);
    setDraft(k, v); return;
  }
  const cl = e.target.closest("[data-cloud]");
  if (cl) { const n = parseFloat(cl.value); if (Number.isFinite(n) && n >= 0) state.cloud[cl.dataset.cloud] = Math.round(n * 1e6); go({ keepScroll: true }); }
});
document.addEventListener("input", e => {
  const id = e.target.id; if (id !== "cap-q" && id !== "cfg-q") return;
  state[id === "cap-q" ? "capQ" : "cfgQ"] = e.target.value; const pos = e.target.selectionStart;
  go({ keepScroll: true }); const q = $("#" + id); q.focus(); q.setSelectionRange(pos, pos);
});

document.addEventListener("change", e => {
  const t = e.target, id = state.capSel;
  if ("autoToggle" in t.dataset) { AUTO[id] = { ...autoOf(id), toggle: t.checked }; go({ keepScroll: true }); return; }
  if (t.dataset.delegate) {
    const k = t.dataset.delegate, f = FIELDS[k], a = { ...autoOf(id), ranges: { ...autoOf(id).ranges } };
    if (t.checked) a.ranges[k] = f.t === "bool" ? [0, 1] : f.t === "hour" ? [Math.max(0, val(k) - 2), Math.min(23, val(k) + 2)] : [Math.round(val(k) * .5 * 1000) / 1000, Math.round(val(k) * 1.5 * 1000) / 1000];
    else { delete a.ranges[k]; delete AGENT_OVR[k]; }
    AUTO[id] = a; go({ keepScroll: true }); return;
  }
  if (t.dataset.range) {
    const k = t.dataset.range, f = FIELDS[k], n = parseFloat(t.value), a = autoOf(id);
    if (!Number.isFinite(n) || n < 0) { toast("请输入不小于 0 的数字"); go({ keepScroll: true }); return; }
    const r = [...a.ranges[k]]; r[+t.dataset.end] = n * (f.f || 1); if (r[0] > r[1]) { r.reverse(); toast("最小值大于最大值，已自动交换"); }
    a.ranges[k] = r; if (k in AGENT_OVR && (AGENT_OVR[k] < r[0] || AGENT_OVR[k] > r[1])) { delete AGENT_OVR[k]; toast("她当前的调整超出新范围，已还原"); }
    go({ keepScroll: true });
  }
});
function normList(f, raw) {
  let x = raw.trim().toLowerCase();
  if (!x) return [null, "请输入内容。"];
  if (f.kind === "host") {
    if (x.includes("://")) { try { x = new URL(x).hostname; } catch (e) { return [null, "这不是有效的网址。"]; } }
    x = x.replace(/\/.*$/, "").replace(/\.$/, "");
    if (x.includes("*")) return [null, "不支持通配符，请逐个填写域名。"];
    if (/^[\d.]+$/.test(x) || x.includes(":")) return [null, "不支持 IP 地址，请填写域名。"];
    if (/\.(localhost|local|internal)$/.test(x)) return [null, "不支持内网地址。"];
    if (x.length > 253 || !/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(x)) return [null, "域名格式不对，例如 sspai.com。"];
  } else if (!/^[a-z_]{1,32}$/.test(x)) return [null, "只能用小写英文字母和下划线。"];
  return [x, null];
}
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-list-add]"); if (!form) return;
  e.preventDefault();
  const k = form.dataset.listAdd, f = FIELDS[k], inp = $("input", form), err = form.nextElementSibling, cur = val(k);
  const [x, msg] = normList(f, inp.value);
  const fail = m => { err.textContent = m; err.hidden = false; inp.focus(); };
  if (msg) return fail(msg);
  if (cur.includes(x)) return fail(`${x} 已经在名单里。`);
  if (cur.length >= f.max) return fail(`最多 ${f.max} 项。`);
  setDraft(k, [...cur, x]);
  const again = $(`[data-list-add="${k}"] input`); if (again) again.focus({ preventScroll: true });
  toast(`已加入 ${x}，保存为新版本后生效`);
});
document.addEventListener("click", e => {
  const m = e.target.closest("[data-list-mode]");
  if (m) { setDraft(m.dataset.listMode, m.dataset.v); toast(m.dataset.v === "deny" ? "已改为黑名单，保存为新版本后生效" : "已改为白名单，保存为新版本后生效"); return; }
  const b = e.target.closest("[data-list-rm]"); if (!b) return;
  const k = b.dataset.listRm, cur = [...val(k)]; const [x] = cur.splice(+b.dataset.i, 1);
  setDraft(k, cur); toast(`已移除 ${x}，保存为新版本后生效`);
});
/* 记忆操作 */
function memoryAction(id, act) {
  const m = D.memories.find(m => m.id === id);
  if (act === "confirm") { m.st = "CONFIRMED"; m.review = false; delete m.why; D.counts.review--; go(); toast("已确认这条记忆"); return; }
  if (act === "correct") {
    const d = dialog("纠正这条记忆", `<p>会创建一条替代记录，原记录保留修订关系，不会被直接覆盖。</p><label class="field"><span>原内容</span><input class="input" value="${esc(m.text)}" disabled></label><label class="field"><span>正确的内容</span><textarea class="input" id="mem-new" style="min-height:80px">${esc(m.text)}</textarea></label>`, `<button class="btn primary" value="ok">保存纠正</button>`);
    d.addEventListener("close", () => { if (d.returnValue !== "ok") return; m.text = $("#mem-new").value.trim() || m.text; if (m.review) { m.review = false; D.counts.review--; } m.st = "CONFIRMED"; delete m.why; go(); toast("已保存纠正"); }, { once: true });
    return;
  }
  const d = dialog("忘记这条记忆？", `<p>“${esc(m.text)}”</p><ul class="consequence"><li>清除这条记忆和它引用的原始消息</li><li>失效可能复述它的近期回复、摘要与自我观察</li><li>从旧备份恢复时也会重新执行这次遗忘</li><li>已经发到 QQ 的消息无法撤回</li></ul>`, `<button class="btn danger solid" value="ok">忘记这条记忆</button>`);
  d.addEventListener("close", () => { if (d.returnValue !== "ok") return; if (m.review) D.counts.review--; D.memories = D.memories.filter(x => x !== m); go(); toast("已忘记这条记忆"); }, { once: true });
}

/* 投递核对 */
function reconcile(id) {
  const p = D.problems.find(p => p.id === id); if (!p) return;
  const d = dialog("核对这条消息", `<p>17:58 发送时连接中断，系统无法确认它是否到达。请打开 QQ 私聊查看，再告诉控制台结果。这里不会重新发送。</p>
    <blockquote class="quote"><small>待核对的消息 ${id}</small>${esc(p.text)}</blockquote>
    <div class="radio-list"><label><input type="radio" name="rc" value="sent" checked><span><b>QQ 里能看到，已发送</b><span>标记为已发送，计入对话记录</span></span></label>
    <label><input type="radio" name="rc" value="cancel"><span><b>QQ 里没有，取消这条</b><span>标记为未发送，不会补发</span></span></label></div>`, `<button class="btn primary" value="ok">保存核对结果</button>`);
  d.addEventListener("close", () => {
    if (d.returnValue !== "ok") return;
    const sent = $("input[name=rc]:checked", d)?.value === "sent";
    D.problems = D.problems.filter(x => x !== p); D.day.forEach(e => { if (e.k === "bad" && e.title.includes("投递")) { e.k = "chat"; e.title = sent ? "回复已核对为送达" : "回复已核对为未发送"; } });
    go(); toast(sent ? "已核对为已发送" : "已核对为取消，不会补发");
  }, { once: true });
}

/* 主动行为开关 */
function modeDialog() {
  const d = dialog("管理主动行为", `<p>只影响她主动做的事。你发来的消息始终会回复。</p>
    <div class="radio-list"><label><input type="radio" name="md" value="run" ${state.paused ? "" : "checked"}><span><b>保持运行</b><span>主动分享、日记整理、自主探索按配置进行</span></span></label>
    <label><input type="radio" name="md" value="pause" ${state.paused ? "checked" : ""}><span><b>全部暂停</b><span>不主动找你，不写日记，不探索新内容。已接受的任务继续处理</span></span></label></div>`, `<button class="btn primary" value="ok">保存</button>`);
  d.addEventListener("close", () => { if (d.returnValue !== "ok") return; state.paused = $("input[name=md]:checked", d).value === "pause"; for (const k in CAP_RUNTIME) CAP_RUNTIME[k] = state.paused; go(); toast(state.paused ? "主动行为已暂停" : "主动行为已恢复"); }, { once: true });
}

/* 日记 */
function diaryAction(act) {
  const e = D.diary[state.diaryDay];
  if (act === "edit") {
    const d = dialog(`修订 ${e.title}`, `<p>修订会保留之前的版本。修订后是第 ${e.rev + 1} 版。</p><label class="field"><span>正文</span><textarea class="input" id="dia-body" style="min-height:240px;font-family:var(--serif)">${esc(e.body.join("\n\n"))}</textarea></label>`, `<button class="btn primary" value="ok">保存修订</button>`);
    d.addEventListener("close", () => { if (d.returnValue !== "ok") return; e.body = $("#dia-body").value.split(/\n\s*\n/).filter(Boolean); e.rev++; e.saved += "（刚刚修订）"; go(); toast(`已保存第 ${e.rev} 版`); }, { once: true });
    return;
  }
  const d = dialog(`删除 ${e.title} 的日记？`, `<ul class="consequence"><li>清除正文和所有修订版本</li><li>从旧备份恢复时，这天的副本也会被清除</li><li>不会删除这天的对话记录和记忆</li></ul>`, `<button class="btn danger solid" value="ok">删除这天的日记</button>`);
  d.addEventListener("close", () => { if (d.returnValue !== "ok") return; delete D.diary[state.diaryDay]; delete D.diaryDays[state.diaryDay]; go(); toast("已删除这天的日记"); }, { once: true });
}

/* 详情抽屉 */
function contentDetail(i) {
  const [s, , t, sub, st, cost, when] = D.content[i];
  const note = { WATCHED: "已根据字幕和弹幕整理要点。没有观看画面，回复中不会声称看过。", PARTIAL: "只取得了部分内容，回复中会说明还没读完。", FAILED: "读取失败，没有进入对话。", RUNNING: "正在读取，费用先预留，完成后结算。" }[st] || "内容已进入对话，作为不可信证据使用。";
  drawer(esc(t), `${s}，${when}`, `<div style="margin-bottom:14px">${tag(st)}</div><p style="margin-bottom:14px">${note}</p>
    <div class="kv"><span>来源说明</span><span>${esc(sub)}</span></div><div class="kv"><span>费用</span><span class="num">${cost}</span></div><div class="kv"><span>保留期</span><span>30 天后自动清除原文</span></div><div class="kv"><span>读取授权</span><span>主人分享，单次</span></div>
    <div style="display:flex;gap:8px;margin-top:20px"><button class="btn danger" data-drawer-close>${ic("trash")}忘记这份内容</button></div>`);
}
function memeDetail(i) {
  const [e, bg, n, st, tags] = D.memes[i];
  drawer(esc(n), "表情素材", `<div style="aspect-ratio:1.6;border-radius:12px;background:${bg};display:grid;place-items:center;font-size:72px;margin-bottom:16px">${e}</div>
    <div class="kv"><span>状态</span>${tag(st)}</div><div class="kv"><span>理解出的情绪</span><span>${tags}</span></div><div class="kv"><span>来源</span><span>${st === "QUARANTINED" ? "未通过来源审核" : "主人发送"}</span></div><div class="kv"><span>最近使用</span><span>${st === "INDEXED" ? "今天 16:15" : "从未"}</span></div>
    ${st === "REVIEW" ? `<div style="display:flex;gap:8px;margin-top:20px"><button class="btn primary" data-drawer-close>通过审核</button><button class="btn quiet" data-drawer-close>不使用</button></div>` : ""}`);
}

/* 命令面板 */
function openPalette() {
  const p = $("#palette");
  const items = [...ROUTES.flatMap(([, r]) => r.map(([k, n, i]) => ({ t: n, s: "页面", i, go: "#" + k }))),
    ...D.memories.map(m => ({ t: m.text, s: "记忆", i: "memory", go: "#memories" })),
    ...D.content.map(c => ({ t: c[2], s: "阅读", i: "book", go: "#content" }))];
  p.innerHTML = `<input class="input" id="pal-q" placeholder="搜索页面、记忆或阅读内容" aria-label="搜索"><ul id="pal-list"></ul>`;
  const draw = q => { const r = items.filter(x => x.t.includes(q)).slice(0, 12);
    $("#pal-list").innerHTML = r.length ? r.map((x, i) => `<li><button class="${i === 0 ? "sel" : ""}" data-pal="${x.go}">${ic(x.i)}<span>${esc(x.t)}</span><small>${x.s}</small></button></li>`).join("") : `<li class="empty">没有找到“${esc(q)}”</li>`; };
  draw("");
  $("#pal-q").addEventListener("input", e => draw(e.target.value));
  $("#pal-q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("#pal-list button"); if (b) { location.hash = b.dataset.pal; p.close(); } } });
  $("#pal-list").addEventListener("click", e => { const b = e.target.closest("[data-pal]"); if (b) { location.hash = b.dataset.pal; p.close(); } });
  p.addEventListener("click", e => { if (e.target === p) p.close(); });
  p.showModal();
}
$("#search-open").addEventListener("click", openPalette);

resetCloud(); state.paused = Object.values(CAP_RUNTIME).every(Boolean);
mount();
if (location.search.includes("app") || location.hash) enterApp(); else { $("#login").hidden = false; $("#pw").focus(); }
</script>
