<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Companion 主人控制台</title>
  <link rel="stylesheet" href="./app.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="boot" class="loading" role="status"><span class="spin"></span>正在恢复会话…</div>

  <div id="login" class="login" hidden>
    <section class="login-art" aria-hidden="true">
      <span class="brand"><span class="brand-mark"><i></i><i></i></span><span><b>Companion</b><small>主人控制台</small></span></span>
      <div class="moon"></div>
      <h1>她今天做了什么，<br>想记住什么，花了多少。</h1>
      <p>只有你能打开这里。每一条记忆都能追到原话，每一笔费用都有账可查。</p>
      <div class="strip" id="login-strip"></div>
    </section>
    <section class="login-form">
      <form id="login-form" novalidate>
        <h2>登录控制台</h2>
        <label class="field"><span>控制台密码</span>
          <input class="input" id="pw" type="password" autocomplete="current-password" required>
        </label>
        <p class="err" id="login-err" role="alert" hidden></p>
        <button class="btn primary" id="login-submit" type="submit">登录</button>
        <p class="hint">密码不会保存在浏览器里。退出后，页面上的私人内容会被清除。</p>
      </form>
    </section>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="side" id="side" aria-label="主导航">
      <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span><b>Companion</b><small>主人控制台</small></span></a>
      <div class="presence" id="presence"></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div><strong>主人会话</strong><span id="session-left"></span></div>
        <button class="icon-btn" id="logout" type="button" title="退出登录" aria-label="退出登录"><span data-icon="logout"></span></button>
      </div>
    </aside>
    <div class="main">
      <header class="top" id="top">
        <button class="icon-btn menu-btn" id="menu" type="button" aria-label="打开导航"><span data-icon="menu"></span></button>
        <span class="crumb" id="crumb"></span>
        <button class="search-btn" id="search-open" type="button"><span data-icon="search"></span><span class="sb-text">跳转到页面</span><kbd>Ctrl K</kbd></button>
        <span class="conn" id="conn" role="status"><i></i><span>正在连接</span></span>
        <button class="icon-btn" id="refresh" type="button" title="刷新" aria-label="刷新当前页面"><span data-icon="refresh"></span></button>
      </header>
      <main class="page-wrap">
        <div id="notice" class="notice" role="status" hidden></div>
        <div class="page" id="page" tabindex="-1" aria-busy="false"></div>
      </main>
    </div>
  </div>

  <dialog id="dlg"></dialog>
  <dialog id="palette" class="palette" aria-label="跳转到页面"></dialog>
  <div id="drawer-scrim" class="drawer-scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true"></aside>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
